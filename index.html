function toggleBudgetModalFields(){const t=document.getElementById('bmType').value;document.getElementById('bmGoal').style.display=t==='goal'?'':'none';document.getElementById('bmMonthly').style.display=t==='recurring'?'':'none';document.getElementById('bmSpending').style.display=t==='spending'?'':'none'}
function submitBudgetModal(){
  const name=document.getElementById('bmName').value.trim(),type=document.getElementById('bmType').value;
  if(!name)return;
  if(type==='recurring'){
    const monthlyTarget=parseFloat(document.getElementById('bmMonthlyAmount').value),notes=document.getElementById('bmMonthlyNotes').value.trim();
    if(!(monthlyTarget>0))return alert('Enter a monthly amount above $0.');
    state.budgets.push({id:genId(),name,type:'recurring',amount:0,monthlyTarget,timeframe:'monthly',createdAt:new Date().toISOString().slice(0,10),paidThrough:0,contributions:{},skippedPeriods:{},notes});
  } else if (type==='spending'){
    const monthlyLimit=parseFloat(document.getElementById('bmSpendingLimit').value),notes=document.getElementById('bmSpendingNotes').value.trim();
    if(!(monthlyLimit>0))return alert('Enter a spending limit above $0.');
    state.budgets.push({id:genId(),name,type:'spending',monthlyLimit,expenses:[],notes,createdAt:new Date().toISOString().slice(0,10)});
  } else {
    const target=parseFloat(document.getElementById('bmTarget').value),deadline=document.getElementById('bmDate').value,timeframe=document.getElementById('bmTime').value,notes=document.getElementById('bmGoalNotes').value.trim();
    if(!(target>0)||!deadline)return alert('Enter a target amount and date.');
    const createdAt=new Date().toISOString().slice(0,10),totalPeriods=Math.max(1,periodsUntil(createdAt,deadline,timeframe));
    state.budgets.push({id:genId(),name,type:'goal',amount:0,target,deadline,timeframe,totalPeriods,installment:target/totalPeriods,createdAt,paidThrough:0,contributions:{},skippedPeriods:{},notes});
  }
  closeModal();save();
}

/* ---------- spending / envelope budgets ---------- */
function currentMonthKey(){ return new Date().toISOString().slice(0,7); }
function spentThisMonth(b){
  const key = currentMonthKey();
  return (b.expenses||[]).filter(e => e.date.slice(0,7)===key).reduce((s,e)=>s+(Number(e.amount)||0), 0);
}
function startEditSpendingLimit(id, amount){
  state.editingLimit = {id, value:String(amount)};
  render();
  const el = document.getElementById('limit-input');
  if (el){ el.focus(); el.select(); }
}
function commitSpendingLimit(id){
  const el = document.getElementById('limit-input');
  const n = parseFloat(el ? el.value : state.editingLimit.value);
  const b = state.budgets.find(x=>x.id===id);
  if (b && !isNaN(n) && n>=0) b.monthlyLimit = n;
  state.editingLimit = null;
  save(); render();
}
function startLogExpense(id){
  state.loggingExpense = {budgetId:id, value:''};
  render();
  const el = document.getElementById('expense-input');
  if (el) el.focus();
}
function cancelLogExpense(){ state.loggingExpense = null; render(); }
function commitLogExpense(){
  const le = state.loggingExpense;
  if (!le) return;
  const b = state.budgets.find(x=>x.id===le.budgetId);
  if (!b) return;
  const amt = parseFloat(le.value);
  if (isNaN(amt) || amt<=0){ alert('Please enter a valid amount.'); return; }
  if (!b.expenses) b.expenses = [];
  b.expenses.push({id:genId(), amount:amt, date:new Date().toISOString()});
  state.loggingExpense = null;
  save(); render();
}
function removeExpense(budgetId, expenseId){
  const b = state.budgets.find(x=>x.id===budgetId);
  if (!b || !b.expenses) return;
  b.expenses = b.expenses.filter(e=>e.id!==expenseId);
  save(); render();
}

function renderSpendingCard(b, idx){
  const rm = state.reorderMode;
  const color = ROW_COLORS[idx % ROW_COLORS.length];
  const isOpen = !!state.expandedBudgets[b.id];
  const spent = spentThisMonth(b);
  const limit = Number(b.monthlyLimit)||0;
  const remaining = limit - spent;
  const pct = limit>0 ? Math.min(100, Math.round((spent/limit)*100)) : 0;
  const over = remaining < 0;
  const barColor = over ? '#a3483f' : pct>=80 ? 'var(--brass)' : '#3f7a5c';

  const isEditingLimit = state.editingLimit && state.editingLimit.id===b.id;
  const limitControl = isEditingLimit ? `
      <input class="row-input" id="limit-input" inputmode="decimal" value="${state.editingLimit.value}" onkeydown="if(event.key==='Enter'){commitSpendingLimit('${b.id}')}" oninput="state.editingLimit.value=this.value" />
      <button class="icon-btn" style="color:#3f7a5c" onclick="commitSpendingLimit('${b.id}')">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a3483f" onclick="removeItem('budget','${b.id}')">${iconSvg('trash')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="state.editingLimit=null; render();">${iconSvg('x')}</button>
    ` : `<button class="row-amount" onclick="startEditSpendingLimit('${b.id}', ${limit})">${fmt(limit)}/mo</button>`;

  const isLogging = state.loggingExpense && state.loggingExpense.budgetId===b.id;
  const logForm = isLogging ? `
    <div class="budget-form" style="padding:0; border:none; margin-top:6px;">
      <input class="add-input" id="expense-input" inputmode="decimal" placeholder="Expense amount" value="${state.loggingExpense.value}" oninput="state.loggingExpense.value=this.value" onkeydown="if(event.key==='Enter'){commitLogExpense()}" />
      <div class="budget-form-actions">
        <button class="icon-btn" style="color:#3f7a5c" onclick="commitLogExpense()">${iconSvg('check')}</button>
        <button class="icon-btn" style="color:#a8a49a" onclick="cancelLogExpense()">${iconSvg('x')}</button>
      </div>
    </div>` : `<button class="add-row" style="padding:9px; margin:8px 0 0;" onclick="startLogExpense('${b.id}')">${iconSvg('plus')} Log an expense</button>`;

  const monthExpenses = (b.expenses||[]).filter(e=>e.date.slice(0,7)===currentMonthKey()).sort((a,b2)=>new Date(b2.date)-new Date(a.date));
  const logsSection = isOpen ? `
    <div class="budget-details">
      ${b.notes ? `<div class="notes-label">NOTES</div><div class="sub-notes">${escapeHtml(b.notes)}</div>` : ''}
      ${logForm}
      <div class="bubble-label" style="margin:10px 0 6px;">This month's expenses</div>
      ${monthExpenses.length===0 ? `<p class="empty-note" style="padding:6px 0;">Nothing logged yet this month.</p>` : monthExpenses.map(e=>`<div class="budget-meta" style="margin-top:0;"><span>${new Date(e.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span style="display:flex; align-items:center; gap:8px;">${fmt(e.amount)}<button class="icon-btn" style="color:#a3483f" onclick="removeExpense('${b.id}','${e.id}')">${iconSvg('trash')}</button></span></div>`).join('')}
    </div>` : '';

  return `<div class="budget-card no-select" data-id="${b.id}" style="border-left:4px solid ${color}">
    <div class="budget-head">
      <div class="budget-head-left">
        <button class="expand-btn${isOpen?' open':''}" onclick="toggleBudgetExpand('${b.id}')" aria-label="Toggle details">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span class="row-label">${escapeHtml(b.name)}</span>
      </div>
      <div class="row-actions">${limitControl}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${barColor}"></div></div>
    <div class="budget-meta"><span>${over ? `${fmt(Math.abs(remaining))} over budget` : `${fmt(remaining)} left`}</span><span>${fmt(spent)} of ${fmt(limit)} spent</span></div>
    ${logsSection}
  </div>`;
}

function renderBudget(){
  const empty = state.budgets.length===0 ? `<p class="empty-note">No budgets yet. Add a savings goal with a target date, an ongoing monthly amount, or a monthly spending limit.</p>` : '';
  const goals = state.budgets.filter(b => b.type !== 'recurring' && b.type !== 'spending');
  const recurring = state.budgets.filter(b => b.type === 'recurring');
  const spending = state.budgets.filter(b => b.type === 'spending');
  const goalsMonthlyTotal = goals.reduce((sum,b) => sum + ((b.timeframe==='weekly') ? (Number(b.installment)||0)*52/12 : (Number(b.installment)||0)), 0);
  const recurringTotal = recurring.reduce((sum,b)=>sum+(Number(b.monthlyTarget)||0),0);
  const spendingLimitTotal = spending.reduce((sum,b)=>sum+(Number(b.monthlyLimit)||0),0);
  const spendingSpentTotal = spending.reduce((sum,b)=>sum+spentThisMonth(b),0);

  const sections = [
    { key:'goal', label:'GOALS', items: goals, listId:'budgetItems-goal',
      renderItem: (b,i) => renderBudgetCard(b,i),
      total: `<div class="total-bar" style="margin-top:14px;"><span class="total-label">MONTHLY TOTAL</span><span class="total-value">${fmt(goalsMonthlyTotal)} <span style="font:12px Inter;color:var(--bone-dim)">/ mo</span></span></div>` },
    { key:'recurring', label:'ONGOING MONTHLY', items: recurring, listId:'budgetItems-recurring',
      renderItem: (b,i) => renderBudgetCard(b,i+goals.length),
      total: `<div class="total-bar" style="margin-top:14px;"><span class="total-label">MONTHLY TOTAL</span><span class="total-value">${fmt(recurringTotal)} <span style="font:12px Inter;color:var(--bone-dim)">/ mo</span></span></div>` },
    { key:'spending', label:'MONTHLY SPENDING', items: spending, listId:'budgetItems-spending',
      renderItem: (b,i) => renderSpendingCard(b,i+goals.length+recurring.length),
      total: `<div class="total-bar" style="margin-top:14px;"><span class="total-label">SPENT THIS MONTH</span><span class="total-value">${fmt(spendingSpentTotal)} <span style="font:12px Inter;color:var(--bone-dim)">/ ${fmt(spendingLimitTotal)}</span></span></div>` }
  ];

  let firstSection = true;
  const sectionBlocks = sections.map(def => {
    if (!def.items.length) return '';
    const marginTop = firstSection ? '4px' : '20px';
    firstSection = false;
    const itemsHTML = def.items.map((b,i) => def.renderItem(b,i)).join('');
    return `<div>
      <div class="section-label" style="margin-top:${marginTop};">${def.label}</div>
      <div id="${def.listId}">${itemsHTML}</div>
      ${def.total}
    </div>`;
  }).join('');

  return `${renderTopBar('BUDGETS', 'showAddBudgetForm()')}<div class="content">${empty}${sectionBlocks}</div>`;
}

function reorderBudgetType(type, newIdOrder){
  const idxs = [];
  state.budgets.forEach((b,i) => { if (b.type===type || (type==='goal' && b.type!=='recurring' && b.type!=='spending')) idxs.push(i); });
  const byId = {};
  state.budgets.forEach(b => { if (b.type===type || (type==='goal' && b.type!=='recurring' && b.type!=='spending')) byId[b.id] = b; });
  newIdOrder.forEach((id, n) => { if (byId[id] && idxs[n] !== undefined) state.budgets[idxs[n]] = byId[id]; });
  save();
}

function subscriptionBillingLabel(s){
  if (s.billing === 'Other' && String(s.customBilling||'').trim()) return s.customBilling.trim();
  if (s.billing === 'Biweekly') return 'Every 2 weeks';
  if (s.billing === 'Quarterly') return 'Every 3 months';
  if (s.billing === 'Semiannual') return 'Every 6 months';
  return s.billing || 'Monthly';
}

function ordinal(n){
  const v = Number(n)||0;
  const mod100 = v % 100;
  const suffix = mod100>=11 && mod100<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[v%10] || 'th');
  return v + suffix;
}

function subscriptionRenewalText(s){
  const b = s.billing || 'Monthly';
  if (b === 'Monthly') return s.renewalDay ? `Renews on the ${ordinal(s.renewalDay)} · Monthly` : 'Renews monthly';
  if (b === 'Weekly' || b === 'Biweekly') {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const day = s.renewalWeekday == null ? '' : ` · ${days[Number(s.renewalWeekday)]}`;
    return `Renews every ${b === 'Biweekly' ? '2 weeks' : 'week'}${day} · ${subscriptionBillingLabel(s)}`;
  }
  if (b === 'Quarterly' || b === 'Semiannual') return s.renewalDay ? `Renews on the ${ordinal(s.renewalDay)} · ${subscriptionBillingLabel(s)}` : `Renews ${subscriptionBillingLabel(s).toLowerCase()}`;
  if (b === 'Annual') {
    const m = Number(s.renewalMonth)||0, d = Number(s.renewalDay)||0;
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return (m && d) ? `Renews on ${months[m-1]} ${ordinal(d)} · Annual` : 'Renews annually';
  }
  return `Renews · ${subscriptionBillingLabel(s)}`;
}

function subscriptionMonthlyCost(s){
  const a = Number(s.amount)||0;
  const b = s.billing || 'Monthly';
  if (b === 'Weekly') return a*52/12;
  if (b === 'Biweekly') return a*26/12;
  if (b === 'Quarterly') return a/3;
  if (b === 'Semiannual') return a/6;
  if (b === 'Annual') return a/12;
  return a;
}

function nextRenewalDate(s){
  const b = s.billing || 'Monthly';
  const today = new Date(); today.setHours(0,0,0,0);
  if (b === 'Monthly'){
    const day = Number(s.renewalDay)||1;
    let y=today.getFullYear(), m=today.getMonth();
    let d = new Date(y,m,Math.min(day,daysInMonth(y,m)));
    if (d < today){ m+=1; if(m>11){m=0;y+=1;} d = new Date(y,m,Math.min(day,daysInMonth(y,m))); }
    return d;
  }
  if (b === 'Weekly' || b === 'Biweekly'){
    const wd = Number(s.renewalWeekday)||0;
    let d = new Date(today);
    for (let i=0;i<7;i++){ if (d.getDay()===wd) break; d.setDate(d.getDate()+1); }
    return d;
  }
  if (b === 'Annual'){
    const day = Number(s.renewalDay)||1, month = (Number(s.renewalMonth)||1)-1;
    let y = today.getFullYear();
    let d = new Date(y, month, Math.min(day, daysInMonth(y,month)));
    if (d < today){ y+=1; d = new Date(y, month, Math.min(day, daysInMonth(y,month))); }
    return d;
  }
  return null;
}

function daysUntilLabel(date){
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date-today)/86400000);
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return `In ${diff} days`;
}

function renderSubscriptions(){
  const monthly = state.subscriptions.reduce((sum,s)=>sum+subscriptionMonthlyCost(s),0);
  const soon = state.subscriptions
    .map(s => ({s, next: nextRenewalDate(s)}))
    .filter(x => x.next && (x.next - new Date(new Date().setHours(0,0,0,0)))/86400000 <= 7)
    .sort((a,b) => a.next - b.next);
  const soonSection = soon.length ? `<div class="section-label" style="margin-top:20px;">RENEWING SOON</div><div class="budget-card" style="border-left:4px solid var(--brass); margin-bottom:16px;">
    ${soon.map(({s,next}) => `<div class="budget-meta" style="margin-top:0; padding:4px 0;"><span>${escapeHtml(s.name)}</span><span>${fmt(s.amount)} · ${daysUntilLabel(next)}</span></div>`).join('')}
  </div>` : '';
  return `${renderTopBar('SUBSCRIPTIONS','showAddSubscriptionForm()')}<div class="content"><div id="subscriptionList">${state.subscriptions.length?orderedItems(state.subscriptions,state.subscriptionOrder).map((s,i)=>{
    const open=!!state.expandedSubscriptions[s.id], has=!!String(s.notes||'').trim();
    const edit = state.editing && state.editing.scope==='subscription' && state.editing.id===s.id;
    const amountControl = edit ? `<input class="row-input" id="edit-input" inputmode="decimal" value="${s.amount}" onkeydown="if(event.key==='Enter')commitEdit('subscription','${s.id}')" oninput="state.editing.value=this.value"><button class="icon-btn" style="color:#3f7a5c" onclick="commitEdit('subscription','${s.id}')">${iconSvg('check')}</button><button class="icon-btn" style="color:#a8a49a" onclick="state.editing=null;render()">${iconSvg('x')}</button><button class="icon-btn" style="color:#a3483f" onclick="removeItem('subscription','${s.id}')" aria-label="Delete ${escapeHtml(s.name)}">${iconSvg('trash')}</button>` : `<button class="row-amount" onclick="startEdit('subscription','${s.id}',${s.amount})">${fmt(s.amount)}</button>`;
    return `<div class="sub-row sortable-item" data-id="${s.id}" style="border-left:4px solid ${ROW_COLORS[i%ROW_COLORS.length]}"><div class="sub-row-top"><button class="sub-name" style="background:none; border:none; padding:0; text-align:left; cursor:pointer;" onclick="editSubscription('${s.id}')" title="Edit name, billing &amp; notes">${escapeHtml(s.name)}</button><div class="row-actions">${amountControl}</div></div><div class="sub-due">${escapeHtml(subscriptionRenewalText(s))}</div>${has?`<button class="sub-toggle${open?' open':''}" onclick="toggleSubscriptionExpand('${s.id}')">${iconSvg('chevronDown')} ${open?'Hide notes':'Show notes'}</button>`:''}${open&&has?`<div class="sub-details"><div class="sub-notes-label">NOTES</div><div class="sub-notes">${escapeHtml(s.notes)}</div></div>`:''}</div>`
  }).join(''):'<p class="empty-note">No subscriptions yet. Add one to start tracking recurring costs.</p>'}</div><div class="total-bar"><span class="total-label">ESTIMATED MONTHLY COST</span><span style="text-align:right;"><span class="total-value">${fmt(monthly)}</span><div style="font-size:11px; color:var(--bone-dim); margin-top:2px;">${fmt(monthly*12)}/yr</div></span></div>${soonSection}</div>`;
}

function subscriptionControls(prefix, s){
  const billing = s.billing || 'Monthly';
  const day = s.renewalDay || (s.dueDate ? new Date(s.dueDate+'T00:00:00').getDate() : 1);
  const wd = s.renewalWeekday == null ? (s.dueDate ? new Date(s.dueDate+'T00:00:00').getDay() : 0) : s.renewalWeekday;
  const month = s.renewalMonth || (s.dueDate ? new Date(s.dueDate+'T00:00:00').getMonth()+1 : 1);
  const days = Array.from({length:31},(_,i)=>`<option value="${i+1}" ${Number(day)===i+1?'selected':''}>${ordinal(i+1)}</option>`).join('');
  const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>`<option value="${i}" ${Number(wd)===i?'selected':''}>${x}</option>`).join('');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'].map((x,i)=>`<option value="${i+1}" ${Number(month)===i+1?'selected':''}>${x}</option>`).join('');
  const billingOptions = ['Weekly','Biweekly','Monthly','Quarterly','Semiannual','Annual','Other'].map(x=>`<option value="${x}" ${x===billing?'selected':''}>${x==='Biweekly'?'Every 2 weeks':x==='Quarterly'?'Every 3 months':x==='Semiannual'?'Every 6 months':x}</option>`).join('');
  return `<select class="add-input" id="${prefix}Billing" onchange="toggleSubscriptionControls('${prefix}')">${billingOptions}</select><div id="${prefix}ScheduleFields"></div><input class="add-input" id="${prefix}CustomBilling" placeholder="Describe the billing schedule" value="${escapeHtml(s.customBilling||'')}" style="display:${billing==='Other'?'':'none'}">`;
}

function toggleSubscriptionControls(prefix){
  const b=document.getElementById(prefix+'Billing');
  const box=document.getElementById(prefix+'ScheduleFields');
  const custom=document.getElementById(prefix+'CustomBilling');
  if(!b||!box)return;
  const billing=b.value;
  const existingDay=document.getElementById(prefix+'Day')?.value || '1';
  const existingWeekday=document.getElementById(prefix+'Weekday')?.value || '0';
  const existingMonth=document.getElementById(prefix+'Month')?.value || '1';
  if(billing==='Monthly'||billing==='Quarterly'||billing==='Semiannual') box.innerHTML=`<div class="budget-form-row"><label class="field-wrap"><span class="field-label">Renewal day</span><select class="add-input" id="${prefix}Day">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${existingDay==i+1?'selected':''}>${ordinal(i+1)}</option>`).join('')}</select></label></div>`;
  else if(billing==='Weekly'||billing==='Biweekly') box.innerHTML=`<div class="budget-form-row"><label class="field-wrap"><span class="field-label">Renews on</span><select class="add-input" id="${prefix}Weekday">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>`<option value="${i}" ${existingWeekday==i?'selected':''}>${x}</option>`).join('')}</select></label></div>`;
  else if(billing==='Annual') box.innerHTML=`<div class="budget-form-row"><label class="field-wrap"><span class="field-label">Month</span><select class="add-input" id="${prefix}Month">${['January','February','March','April','May','June','July','August','September','October','November','December'].map((x,i)=>`<option value="${i+1}" ${existingMonth==i+1?'selected':''}>${x}</option>`).join('')}</select></label><label class="field-wrap"><span class="field-label">Day</span><select class="add-input" id="${prefix}Day">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${existingDay==i+1?'selected':''}>${ordinal(i+1)}</option>`).join('')}</select></label></div>`;
  else box.innerHTML='';
  if(custom) custom.style.display=billing==='Other'?'':'none';
}

function editSubscription(id){
  const s=state.subscriptions.find(x=>x.id===id);if(!s)return;
  const body=`<div class="budget-form"><input class="add-input" id="esName" value="${escapeHtml(s.name)}"><input class="add-input" id="esAmount" value="${s.amount}" inputmode="decimal"><div id="esControls">${subscriptionControls('es',s)}</div><div class="notes-label">NOTES</div><textarea class="add-input notes-box" id="esNotes">${escapeHtml(s.notes||'')}</textarea><div class="budget-form-actions"><button class="icon-btn" style="color:#3f7a5c" onclick="saveSubscriptionEdit('${id}')">${iconSvg('check')}</button><button class="icon-btn" style="color:#a8a49a" onclick="closeModal()">${iconSvg('x')}</button></div></div>`;
  openModal('Edit Subscription',body);
  setTimeout(()=>toggleSubscriptionControls('es'),0);
}

function saveSubscriptionEdit(id){
  const s=state.subscriptions.find(x=>x.id===id);if(!s)return;
  const name=document.getElementById('esName').value.trim(), amount=parseFloat(document.getElementById('esAmount').value), billing=document.getElementById('esBilling').value;
  const custom=(document.getElementById('esCustomBilling')?.value||'').trim();
  if(!name||isNaN(amount)||amount<=0){alert('Please enter a name and an amount above $0.');return;}
  if(billing==='Other'&&!custom){alert('Please describe the billing schedule.');return;}
  const day=document.getElementById('esDay')?.value, weekday=document.getElementById('esWeekday')?.value, month=document.getElementById('esMonth')?.value;
  s.name=name;s.amount=amount;s.billing=billing;s.customBilling=custom;s.notes=document.getElementById('esNotes').value.trim();
  if(day) s.renewalDay=Number(day); if(weekday!=null) s.renewalWeekday=Number(weekday); if(month) s.renewalMonth=Number(month);
  delete s.dueDate;
  closeModal();save();render();
}

function showAddSubscriptionForm(){
  const blank={billing:'Monthly',notes:'',customBilling:'',renewalDay:1,renewalWeekday:0,renewalMonth:1};
  openModal('Add Subscription',`<div class="budget-form"><input class="add-input" id="subName" placeholder="Subscription name"><input class="add-input" id="subAmount" placeholder="Amount" inputmode="decimal"><div id="subControls">${subscriptionControls('sub',blank)}</div><div class="notes-label">NOTES</div><textarea class="add-input notes-box" id="subNotes" placeholder="Payment method/account, what it's for, billing details, or anything else to remember."></textarea><div class="budget-form-actions"><button class="icon-btn" style="color:#3f7a5c" onclick="submitAddSubscription()">${iconSvg('check')}</button><button class="icon-btn" style="color:#a8a49a" onclick="closeModal()">${iconSvg('x')}</button></div></div>`);
  setTimeout(()=>toggleSubscriptionControls('sub'),0);
}

function submitAddSubscription(){
  const name=document.getElementById('subName').value.trim(), amount=parseFloat(document.getElementById('subAmount').value), billing=document.getElementById('subBilling').value, custom=(document.getElementById('subCustomBilling')?.value||'').trim(), notes=document.getElementById('subNotes').value.trim();
  if(!name||isNaN(amount)||amount<=0){alert('Please enter a name and an amount above $0.');return;}
  if(billing==='Other'&&!custom){alert('Please describe the billing schedule.');return;}
  const s={id:genId(),name,amount,billing,customBilling:custom,notes};
  const day=document.getElementById('subDay')?.value, weekday=document.getElementById('subWeekday')?.value, month=document.getElementById('subMonth')?.value;
  if(day) s.renewalDay=Number(day); if(weekday!=null) s.renewalWeekday=Number(weekday); if(month) s.renewalMonth=Number(month);
  state.subscriptions.push(s);closeModal();save();render();
}

function showAddLiabilityForm(){openModal('Add Liability',`<div class="budget-form"><input class="add-input" id="liabilityName" placeholder="Name"><select class="add-input" id="liabilityType"><option value="owe">You owe (debt)</option><option value="owed">Owed to you</option></select><div class="budget-form-actions"><button class="icon-btn" style="color:#3f7a5c" onclick="submitAddLiability()">${iconSvg('check')}</button><button class="icon-btn" style="color:#a8a49a" onclick="closeModal()">${iconSvg('x')}</button></div></div>`)}
function submitAddLiability(){const name=document.getElementById('liabilityName').value.trim(),type=document.getElementById('liabilityType').value;if(!name){alert('Please enter a name.');return;}addItem('liability',name,{type});closeModal();}
function startEdit(scope, id, amount){
  state.editing = {scope, id, value:String(amount)};
  render();
  const el = document.getElementById('edit-input');
  if (el){ el.focus(); el.select(); }
}

function commitEdit(scope, id){
  const el = document.getElementById('edit-input');
  const n = parseFloat(el ? el.value : state.editing.value);
  if (!isNaN(n)) updateAmount(scope, id, n);
  else { state.editing = null; render(); }
}

let chartInstance = null;
let scrubIndex = null;
let crosshairRegistered = false;

function getFilteredTransactions(){
  const cutoff = getRangeCutoffDate(state.ledgerRange);
  const inRange = t => !cutoff || new Date(t.date) >= cutoff;
  return state.transactions
    .filter(inRange)
    .filter(t => state.areaFilter[t.scope]);
}

function getRangeCutoffDate(range){
  const now = new Date();
  if (range === '1D') return new Date(now.getTime() - 24*3600*1000);
  if (range === '1W') return new Date(now.getTime() - 7*24*3600*1000);
  if (range === '1M'){ const d = new Date(now); d.setMonth(d.getMonth()-1); return d; }
  if (range === '1Y'){ const d = new Date(now); d.setFullYear(d.getFullYear()-1); return d; }
  return null;
}

function setLedgerRange(r){
  state.ledgerRange = r;
  render();
}

function toggleAreaDropdown(){
  state.areaDropdownOpen = !state.areaDropdownOpen;
  render();
}

function toggleArea(area){
  state.areaFilter[area] = !state.areaFilter[area];
  render();
}

function toggleAllAreas(){
  const allSelected = Object.values(state.areaFilter).every(v=>v);
  const next = !allSelected;
  Object.keys(state.areaFilter).forEach(k => state.areaFilter[k] = next);
  render();
}

function areaFullLabel(a){
  return a==='safe'?'Safe':a==='bank'?'Bank':a==='liability'?'Liability':a==='budget'?'Budget':'Subscriptions';
}

function projectionRatePerDay(){
  if (state.transactions.length < 2) return null;
  const now = computeNetWorth();
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate()-30);
  let pastValue = netWorthSnapshotBefore(cutoff);
  let daysSpan = 30;
  if (pastValue === null){
    const sorted = [...state.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const earliest = sorted[0];
    const earliestDay = new Date(earliest.date); earliestDay.setHours(0,0,0,0);
    daysSpan = Math.max(1, Math.round((today - earliestDay)/86400000));
    pastValue = earliest.total - earliest.delta;
  }
  if (daysSpan <= 0) return null;
  return (now - pastValue) / daysSpan;
}

function renderProjectionCard(){
  const rate = projectionRatePerDay();
  if (rate === null) return '';
  const now = computeNetWorth();
  const proj = (months) => now + rate*30*months;
  return `<div class="budget-card" style="border-left:4px solid var(--brass); margin-bottom:16px;">
    <div class="section-label" style="margin-bottom:10px;">PROJECTED NET WORTH</div>
    <div class="budget-meta" style="margin-top:0;"><span>3 months</span><span style="font-family:'JetBrains Mono',monospace;">${fmt(proj(3))}</span></div>
    <div class="budget-meta" style="margin-top:6px;"><span>6 months</span><span style="font-family:'JetBrains Mono',monospace;">${fmt(proj(6))}</span></div>
    <div class="budget-meta" style="margin-top:6px;"><span>12 months</span><span style="font-family:'JetBrains Mono',monospace;">${fmt(proj(12))}</span></div>
    <div class="panel-sub" style="margin-top:8px;">Based on your recent trend — not a guarantee</div>
  </div>`;
}

function renderLedger(){
  const filteredAsc=getFilteredTransactions().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const filtered=[...filteredAsc].reverse();
  const latest=filteredAsc.length?filteredAsc[filteredAsc.length-1]:null;
  const areas=['safe','bank','liability','budget','subscription'];
  const activeAreas=areas.filter(a=>state.areaFilter[a]);
  const allAreasSelected=activeAreas.length===areas.length;
  const rangeTabs=[['1D','1D'],['1W','1W'],['1M','1M'],['1Y','1Y'],['All','all']].map(([label,key])=>`<button class="range-tab${state.ledgerRange===key?' active':''}" onclick="setLedgerRange('${key}')">${label}</button>`).join('');
  const areaLabel=allAreasSelected?'All areas':(activeAreas.length?activeAreas.map(areaFullLabel).join(', '):'No areas selected');
  const areaMenu=state.areaDropdownOpen?`<div class="area-menu"><label class="area-option"><input type="checkbox" ${allAreasSelected?'checked':''} onchange="toggleAllAreas()"> All</label>${areas.map(a=>`<label class="area-option"><input type="checkbox" ${state.areaFilter[a]?'checked':''} onchange="toggleArea('${a}')"> ${areaFullLabel(a)}</label>`).join('')}</div>`:'';

  const selMode = state.ledgerSelectMode;
  const selectedCount = state.selectedTxIds.length;
  const allVisibleSelected = filtered.length>0 && filtered.every(t=>state.selectedTxIds.includes(t.id));

  const rows=filtered.map(t=>{
    const checked = state.selectedTxIds.includes(t.id);
    const checkbox = selMode ? `<label class="tx-checkbox" onclick="event.stopPropagation()"><input type="checkbox" ${checked?'checked':''} onchange="toggleTxSelected('${t.id}')"></label>` : '';
    return `<div class="tx-item${selMode?' selectable':''}" ${selMode?`onclick="toggleTxSelected('${t.id}')"`:''}>${checkbox}<div style="flex:1; min-width:0;"><div class="tx-description">${escapeHtml(txDescription(t))}</div><div class="tx-context">${escapeHtml(t.location||'')}</div><div class="tx-date">${new Date(t.date).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div></div><div class="tx-delta" style="color:${t.delta>=0?'#3f7a5c':'#a3483f'}">${t.delta>=0?'+':'-'}${fmt(Math.abs(t.delta)).slice(1)}</div></div>`;
  }).join('');

  const chart=filteredAsc.length<2?`<p class="empty-note">Not enough activity in this range to chart yet.</p>`:`<div style="height:200px"><canvas id="netChart"></canvas></div>`;

  const selectBar = selMode ? `<div class="select-bar">
      <label class="area-option" style="margin:0;"><input type="checkbox" ${allVisibleSelected?'checked':''} onchange="toggleSelectAllTx()"> Select all (${filtered.length})</label>
      <div style="display:flex; gap:8px;">
        <button class="chip-btn" onclick="cancelTxSelectMode()">Cancel</button>
        <button class="chip-btn" style="color:#a3483f; border-color:#a3483f;" onclick="deleteSelectedTx()" ${selectedCount===0?'disabled':''}>Delete (${selectedCount})</button>
      </div>
    </div>` : '';

  return `${renderRootTopBar('Ledger',true)}<div class="content"><div class="chart-card"><div class="chart-scrub"><div class="chart-scrub-value" id="scrubValue">${latest?fmt(latest.total):fmt(computeNetWorth())}</div><div class="chart-scrub-delta" id="scrubDelta"></div><div class="chart-scrub-date" id="scrubDate">${latest?'Current':'No activity yet'}</div></div>${chart}</div>${renderProjectionCard()}<div class="range-tabs-row">${rangeTabs}</div><div class="area-dropdown"><button class="area-toggle${state.areaDropdownOpen?' open':''}" onclick="toggleAreaDropdown()"><span>${areaLabel}</span>${iconSvg('chevronDown')}</button>${areaMenu}</div><button class="ledger-toggle" onclick="state.ledgerCollapsed=!state.ledgerCollapsed;render()"><span>${state.ledgerCollapsed?'Show':'Hide'} ledger history</span><span class="ledger-count">${filtered.length} ${filtered.length===1?'entry':'entries'}</span></button>${selectBar}${state.ledgerCollapsed?'':`<div class="ledger-list">${rows||'<p class="empty-note">No transactions in this range.</p>'}</div>`}</div>`;
}

function startLedgerSelectMode(){
  state.ledgerSelectMode = true;
  state.selectedTxIds = [];
  state.ledgerCollapsed = false;
  navigate('ledger');
}
function cancelTxSelectMode(){
  state.ledgerSelectMode = false;
  state.selectedTxIds = [];
  render();
}
function toggleTxSelected(id){
  const i = state.selectedTxIds.indexOf(id);
  if (i===-1) state.selectedTxIds.push(id); else state.selectedTxIds.splice(i,1);
  render();
}
function toggleSelectAllTx(){
  const ids = getFilteredTransactions().map(t=>t.id);
  const allSelected = ids.length>0 && ids.every(id=>state.selectedTxIds.includes(id));
  state.selectedTxIds = allSelected ? [] : ids.slice();
  render();
}
function deleteSelectedTx(){
  if (state.selectedTxIds.length===0) return;
  const n = state.selectedTxIds.length;
  const body = `<div class="budget-form">
    <p class="empty-note" style="text-align:left; padding:0;">Remove ${n} ledger ${n===1?'entry':'entries'}? This only clears the log — it won't change your current balances. You can undo this from Settings afterward.</p>
    <div class="budget-form-actions">
      <button class="icon-btn" style="color:#a3483f" onclick="confirmDeleteSelectedTx()">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="closeModal()">${iconSvg('x')}</button>
    </div>
  </div>`;
  openModal('Remove entries?', body);
}
function confirmDeleteSelectedTx(){
  const idSet = new Set(state.selectedTxIds);
  const toTrash = state.transactions.filter(t=>idSet.has(t.id)).map(t=>({...t, deletedAt:new Date().toISOString()}));
  state.transactions = state.transactions.filter(t=>!idSet.has(t.id));
  state.deletedTx = [...(state.deletedTx||[]), ...toTrash];
  state.selectedTxIds = [];
  state.ledgerSelectMode = false;
  closeModal();
  save(); render();
}
function openDeletedTxModal(){
  const items = (state.deletedTx||[]).slice().sort((a,b)=>new Date(b.deletedAt)-new Date(a.deletedAt));
  const rows = items.map(t=>`<div class="tx-item"><div style="flex:1; min-width:0;"><div class="tx-description">${escapeHtml(txDescription(t))}</div><div class="tx-context">${escapeHtml(t.location||'')}</div><div class="tx-date">${new Date(t.date).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div></div><button class="icon-btn" style="color:#3f7a5c" onclick="restoreDeletedTx('${t.id}')" aria-label="Restore entry">${iconSvg('upload')}</button></div>`).join('');
  const body = items.length ? `<div class="budget-form">
      <div class="ledger-list" style="max-height:48vh; overflow:auto;">${rows}</div>
      <div class="budget-form-actions" style="justify-content:space-between;">
        <button class="chip-btn" style="color:#a3483f; border-color:#a3483f;" onclick="emptyDeletedTx()">Empty trash</button>
        <button class="chip-btn" onclick="restoreAllDeletedTx()">Restore all</button>
      </div>
    </div>` : `<p class="empty-note">No recently deleted entries.</p>`;
  openModal(`Recently deleted (${items.length})`, body);
}
function restoreDeletedTx(id){
  const idx = (state.deletedTx||[]).findIndex(t=>t.id===id);
  if (idx===-1) return;
  const [tx] = state.deletedTx.splice(idx,1);
  delete tx.deletedAt;
  state.transactions.push(tx);
  save();
  openDeletedTxModal();
}
function restoreAllDeletedTx(){
  const restored = (state.deletedTx||[]).map(t=>{ const c={...t}; delete c.deletedAt; return c; });
  state.transactions.push(...restored);
  state.deletedTx = [];
  save();
  closeModal();
  render();
}
function emptyDeletedTx(){
  state.deletedTx = [];
  save();
  closeModal();
}
function drawChartIfNeeded(){
  const canvas = document.getElementById('netChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') { console.error('Chart.js failed to load'); return; }
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  scrubIndex = null;

  if (!crosshairRegistered){
    Chart.register({
      id: 'crosshair',
      afterDatasetsDraw(chart){
        if (scrubIndex === null) return;
        const meta = chart.getDatasetMeta(0);
        const point = meta.data[scrubIndex];
        if (!point) return;
        const {ctx, chartArea} = chart;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4,4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#c9a24b99';
        ctx.moveTo(point.x, chartArea.top);
        ctx.lineTo(point.x, chartArea.bottom);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5.5, 0, Math.PI*2);
        ctx.fillStyle = '#c9a24b';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#121316';
        ctx.stroke();
        ctx.restore();
      }
    });
    crosshairRegistered = true;
  }

  const filteredAsc = getFilteredTransactions().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const showTime = state.ledgerRange === '1D' || state.ledgerRange === '1W';
  const labels = filteredAsc.map(t => new Date(t.date).toLocaleDateString(undefined, showTime ? {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'} : {month:'short', day:'numeric'}));
  const dateLabels = filteredAsc.map(t => new Date(t.date).toLocaleString(undefined, {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}));
  const data = filteredAsc.map(t => Math.round(t.total*100)/100);

  chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor:'#c9a24b', backgroundColor:'#c9a24b22', tension:.3, pointBackgroundColor:'#c9a24b', pointBorderColor:'#121316', pointBorderWidth:1.5, pointRadius:4, pointHoverRadius:5, fill:true }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      animation:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{display:false}, tooltip:{ enabled:false } },
      scales:{
        x:{ display:false, grid:{ display:false } },
        y:{ ticks:{ color:'#a8a49a', font:{size:11}, callback:(v)=>'$'+v }, grid:{ color:'#2a2c32' } }
      }
    }
  });

  attachScrubEvents(chartInstance, filteredAsc, dateLabels);
}

function attachScrubEvents(chart, sortedData, dateLabels){
  const canvas = chart.canvas;
  const valueEl = document.getElementById('scrubValue');
  const deltaEl = document.getElementById('scrubDelta');
  const dateEl = document.getElementById('scrubDate');
  const latest = sortedData[sortedData.length - 1];

  function pickIndex(evt){
    const points = chart.getElementsAtEventForMode(evt, 'index', {intersect:false}, true);
    return points.length ? points[0].index : null;
  }

  function updateScrub(evt){
    const idx = pickIndex(evt);
    if (idx === null) return;
    scrubIndex = idx;
    chart.update('none');
    const point = sortedData[idx];
    const positive = point.delta >= 0;
    if (valueEl) valueEl.textContent = fmt(point.total);
    if (deltaEl){
      deltaEl.textContent = `${escapeHtml(point.location)} · ${positive?'+':'-'}${fmt(Math.abs(point.delta)).slice(1)}`;
      deltaEl.style.color = positive ? '#3f7a5c' : '#a3483f';
    }
    if (dateEl) dateEl.textContent = dateLabels[idx];
  }

  function endScrub(){
    scrubIndex = null;
    chart.update('none');
    if (valueEl) valueEl.textContent = latest ? fmt(latest.total) : fmt(computeNetWorth());
    if (deltaEl) deltaEl.textContent = '';
    if (dateEl) dateEl.textContent = 'Current';
  }

  canvas.onmousedown = (e) => { updateScrub(e); };
  canvas.onmousemove = (e) => { if (e.buttons === 1) updateScrub(e); };
  canvas.onmouseup = endScrub;
  canvas.onmouseleave = endScrub;

  canvas.ontouchstart = (e) => { updateScrub(e); e.preventDefault(); };
  canvas.ontouchmove = (e) => { updateScrub(e); e.preventDefault(); };
  canvas.ontouchend = endScrub;
  canvas.ontouchcancel = endScrub;
}

let moneySortable = null;
let balancesSortable = null;
let moduleSectionSortable = null;
let budgetItemSortables = {};
let itemSortables = {};

function showReorderDoneBtn(){
  state.reorderMode = true;
  const btn = document.getElementById('reorderDoneBtn');
  if (btn) btn.style.display = 'block';
}

function render(){
  const app = document.getElementById('app');
  const tabBar = document.getElementById('tabBar');
  if (state.locked){
    app.innerHTML = renderLockScreen();
    if (tabBar) tabBar.style.display = 'none';
    return;
  }
  if (state.page==='home') app.innerHTML = renderHome();
  else if (state.page==='modules') app.innerHTML = renderModules();
  else if (state.page==='settings') app.innerHTML = renderSettings();
  else if (state.page==='safe') app.innerHTML = renderSafe();
  else if (state.page==='bank') app.innerHTML = renderBank();
  else if (state.page==='liability') app.innerHTML = renderLiabilities();
  else if (state.page==='budget') app.innerHTML = renderBudget();
  else if (state.page==='subscription') app.innerHTML = renderSubscriptions();
  else if (state.page==='income') app.innerHTML = renderIncome();
  else if (state.page==='ledger') { app.innerHTML = renderLedger(); drawChartIfNeeded(); }
  app.insertAdjacentHTML('beforeend', modalHTML());

  const hiddenOnPages = ['settings'];
  if (tabBar) tabBar.style.display = hiddenOnPages.includes(state.page) ? 'none' : 'flex';

  const modulesPages = ['modules','budget','subscription','liability','income'];
  const homePages = ['home','safe','bank'];
  const activeTab = modulesPages.includes(state.page) ? 'tabModules' : homePages.includes(state.page) ? 'tabVault' : state.page==='ledger' ? 'tabLedger' : null;
  ['tabModules','tabVault','tabLedger'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', id === activeTab);
  });

  const doneBtn = document.getElementById('reorderDoneBtn');
  if (doneBtn) doneBtn.style.display = state.reorderMode ? 'block' : 'none';

  if (moneySortable){ moneySortable.destroy(); moneySortable = null; }
  if (balancesSortable){ balancesSortable.destroy(); balancesSortable = null; }
  if (moduleSectionSortable){ moduleSectionSortable.destroy(); moduleSectionSortable = null; }
  Object.values(budgetItemSortables).forEach(s => s && s.destroy());
  budgetItemSortables = {};
  Object.values(itemSortables).forEach(s => s && s.destroy());
  itemSortables = {};

  if (typeof Sortable !== 'undefined'){
    const opts = { animation:150, delay:150, delayOnTouchOnly:true, touchStartThreshold:6, ghostClass:'sortable-ghost', dragClass:'sortable-drag' };

    const moneyList = document.getElementById('moneyList');
    if (moneyList){
      moneySortable = new Sortable(moneyList, { ...opts,
        onStart: showReorderDoneBtn,
        onEnd: () => { state.moneyOrder = Array.from(moneyList.children).map(el=>el.dataset.key); save(); render(); }
      });
    }
    const balancesList = document.getElementById('balancesList');
    if (balancesList){
      balancesSortable = new Sortable(balancesList, { ...opts,
        onStart: showReorderDoneBtn,
        onEnd: () => { state.balancesOrder = Array.from(balancesList.children).map(el=>el.dataset.key); save(); render(); }
      });
    }
    const moduleSectionList = document.getElementById('moduleSectionList');
    if (moduleSectionList){
      moduleSectionSortable = new Sortable(moduleSectionList, { ...opts,
        filter: '#balancesList, #balancesList *', preventOnFilter: false,
        onStart: showReorderDoneBtn,
        onEnd: () => { state.moduleSectionOrder = Array.from(moduleSectionList.children).map(el=>el.dataset.key); save(); render(); }
      });
    }
    const makeItemSortable = (id, orderKey) => {
      const list = document.getElementById(id);
      if (!list) return;
      itemSortables[id] = new Sortable(list, { ...opts,
        onStart: showReorderDoneBtn,
        onEnd: () => {
          state[orderKey] = Array.from(list.children).map(el=>el.dataset.id).filter(Boolean);
          save(); render();
        }
      });
    };
    makeItemSortable('safeItemsList','safeOrder');
    makeItemSortable('bankItemsList','bankOrder');
    makeItemSortable('subscriptionList','subscriptionOrder');
    makeItemSortable('jobList','jobOrder');
    if (state.debtSort==='none') {
      makeItemSortable('liabilityOweList','liabilityOweOrder');
      makeItemSortable('liabilityOwedList','liabilityOwedOrder');
    }

    ['goal','recurring','spending'].forEach(type => {
      const list = document.getElementById(`budgetItems-${type}`);
      if (list){
        budgetItemSortables[type] = new Sortable(list, { ...opts,
          onStart: showReorderDoneBtn,
          onEnd: () => { reorderBudgetType(type, Array.from(list.children).map(el=>el.dataset.id)); render(); }
        });
      }
    });
  }
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
load();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
