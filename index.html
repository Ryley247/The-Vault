<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>The Vault</title>
<meta name="theme-color" content="#121316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Vault" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#121316; --panel:#1c1e23; --panel-border:#2c2f36; --divider:#2a2c32;
    --brass:#c9a24b; --brass-dim:#8a7038; --bone:#eae5d6; --bone-dim:#a8a49a;
    --ledger-green:#3f7a5c; --steel:#3b5568; --rust:#a3483f; --olive:#736e30; --plum:#6b4a73;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); height:100vh; height:calc(var(--vh, 1vh) * 100); overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;}
  body{font-family:'Inter',sans-serif; color:var(--bone); padding-bottom:env(safe-area-inset-bottom);}
  button{font-family:inherit; background:none; border:none; cursor:pointer; color:inherit; padding:0;}
  input{font-family:inherit;}
  #app{max-width:520px; margin:0 auto; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}

  .topbar{display:flex; align-items:center; gap:12px; padding:22px 20px 12px;}
  .back-btn{color:var(--brass); padding:6px; border-radius:999px; display:flex;}
  .page-title{font-family:'Oswald',sans-serif; font-size:22px; font-weight:500; letter-spacing:.04em; margin:0; flex:1;}
  .topbar-add{display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--brass-dim); color:var(--brass); flex-shrink:0;}
  .section-add{display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--brass-dim); color:var(--brass); flex-shrink:0;}
  .section-head{display:flex; align-items:center; justify-content:space-between;}

  .dial-wrap{width:76px; height:76px; margin:0 auto 6px; position:relative;}
  .dial{width:100%; height:100%; border-radius:50%; border:3px solid var(--brass-dim);
    background:radial-gradient(circle at 35% 30%, #2a2d33, var(--bg) 70%);
    box-shadow:inset 0 0 20px rgba(0,0,0,.6), 0 0 0 6px var(--bg);
    position:relative; animation:spin 60s linear infinite;}
  @media (prefers-reduced-motion: reduce){ .dial{animation:none;} }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .tick{position:absolute; left:50%; top:50%; width:2px; height:42%; transform-origin:bottom; background:var(--panel-border);}
  .tick.major{background:var(--brass);}
  .dial-center{position:absolute; width:40%; height:40%; top:30%; left:30%; border-radius:50%;
    background:linear-gradient(145deg, var(--brass), var(--brass-dim));
    box-shadow:0 2px 6px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;}

  .home-title{text-align:center; margin-top:14px; font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; letter-spacing:.08em;}
  .home-sub{text-align:center; margin:3px 0 1px; color:var(--bone-dim); font-size:11.5px;}
  .net-worth{text-align:center; margin-bottom:16px; color:var(--brass); font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700;}

  .panel-btn{width:100%; display:flex; align-items:center; gap:10px; background:var(--panel);
    border:1px solid var(--panel-border); border-radius:14px; padding:11px 12px; margin-bottom:8px; text-align:left;}
  .panel-btn:active{transform:scale(.99);}
  .panel-icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .panel-icon svg{width:16px; height:16px;}
  .panel-body{flex:1; min-width:0;}
  .panel-title{font-family:'Oswald',sans-serif; font-size:14.5px; letter-spacing:.03em;}
  .panel-sub{color:var(--bone-dim); font-size:11px; margin-top:1px;}
  .panel-value{font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:600; flex-shrink:0;}

  .content{padding:0 20px 100px;}

  .tab-bar{position:fixed; left:0; right:0; bottom:0; display:flex; align-items:flex-start; justify-content:space-around;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:rgba(18,19,22,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--panel-border); z-index:40;}
  .tab-btn{display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; color:var(--bone-dim); background:none; border:none;}
  .tab-btn svg{width:22px; height:22px;}
  .tab-btn .tab-label{font-size:10.5px; font-weight:600; letter-spacing:.02em;}
  .tab-btn.active{color:var(--brass);}
  .tab-vault-icon{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--brass), var(--brass-dim)); color:var(--bg); margin-bottom:0;
    box-shadow:0 2px 8px rgba(201,162,75,.35);}
  .tab-vault-icon svg{width:19px; height:19px;}

  .root-topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 20px 4px;}
  .root-topbar .page-title{margin:0;}
  .gear-btn{display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--brass-dim); color:var(--brass); flex-shrink:0; background:none;}
  .gear-btn svg{width:17px; height:17px;}

  .panel-chevron{flex-shrink:0; opacity:.5;}
  .panel-chevron svg{width:16px; height:16px;}
  .section-label{font-size:11.5px; letter-spacing:.06em; color:var(--brass); font-weight:600; margin-bottom:8px; text-transform:uppercase;}

  .row{display:flex; align-items:center; justify-content:space-between; background:var(--panel);
    border-radius:16px; padding:16px 20px; margin-bottom:12px;}
  .row-label{font-weight:600; font-size:16px;}
  .row-amount{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;}
  .row-actions{display:flex; align-items:center; gap:10px;}
  .row-input{width:96px; text-align:right; background:var(--bg); color:var(--bone);
    border:1px solid var(--brass); border-radius:8px; padding:6px 8px; font-family:'JetBrains Mono',monospace;}
  .icon-btn{padding:2px; display:flex;}

  .add-row{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border:1.5px dashed var(--brass-dim); color:var(--brass); border-radius:16px; padding:12px; margin-bottom:12px;}
  .add-form{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .add-input{flex:1; background:var(--panel); color:var(--bone); border:1px solid var(--panel-border);
    border-radius:12px; padding:12px;}

  .total-bar{display:flex; align-items:center; justify-content:space-between; border-radius:16px;
    padding:16px 20px; margin-top:16px; border:1.5px solid var(--plum); background:linear-gradient(135deg, rgba(107,74,115,.28), rgba(107,74,115,.06));}
  .total-label{font-family:'Oswald',sans-serif; letter-spacing:.05em; font-size:15px;}
  .total-value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700;}

  .chart-card{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:16px; margin-bottom:20px;}
  .chart-scrub{margin-bottom:10px; text-align:left;}
  .chart-scrub-value{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--bone);}
  .chart-scrub-delta{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; margin-top:2px;}
  .chart-scrub-date{font-size:12.5px; color:var(--bone-dim); margin-top:2px;}
  .empty-note{text-align:center; padding:24px 10px; color:var(--bone-dim); font-size:13.5px;}

  .budget-card{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .budget-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px;}
  .budget-head-left{display:flex; align-items:center; gap:8px; min-width:0;}
  .expand-btn{color:var(--bone-dim); flex-shrink:0; transition:transform .2s ease;}
  .expand-btn.open{transform:rotate(180deg); color:var(--brass);}
  .progress-track{height:7px; background:var(--panel-border); border-radius:999px; overflow:hidden; margin-bottom:6px;}
  .progress-fill{height:100%; border-radius:999px; transition:width .3s ease;}
  .budget-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--bone-dim); gap:8px;}
  .budget-details{margin-top:10px; padding-top:10px; border-top:1px solid var(--divider);}
  .budget-suggest{font-size:13.5px; color:var(--bone); margin-bottom:10px;}
  .budget-suggest.achieved{color:#3f7a5c; font-weight:600;}
  .budget-form{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px;}
  .budget-form-row{display:flex; gap:8px;}
  .budget-form-row .add-input{flex:1; min-width:0;}
  .budget-form-actions{display:flex; justify-content:flex-end; gap:14px; padding-top:2px;}
  input[type=date].add-input, select.add-input{color-scheme:dark;}

  .bubble-label{font-size:11.5px; color:var(--bone-dim); margin-bottom:6px;}
  .bubble-row{display:flex; flex-wrap:wrap; gap:8px;}
  .bubble{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--brass-dim); color:var(--brass);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0;}
  .bubble:active{transform:scale(.92);}
  .bubble.next{background:var(--brass); color:var(--bg); border-color:var(--brass);}
  .bubble-done-note{font-size:12px; color:#3f7a5c; font-weight:600;}

  .sub-row{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .sub-row-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .sub-name{font-weight:600; font-size:16px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sub-due{font-size:12px; color:var(--bone-dim);}
  .sub-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .sub-chip{font-size:10.5px; color:var(--bone-dim); border:1px solid var(--panel-border); border-radius:999px; padding:4px 7px;}
  .sub-details{margin-top:10px; padding-top:10px; border-top:1px solid var(--divider);}
  .sub-notes-input{resize:vertical; min-height:72px;}
  .sub-notes{font-size:12.5px; line-height:1.45; color:var(--bone); white-space:pre-wrap; word-break:break-word;}
  .sub-notes-label{font-size:10.5px; color:var(--brass); letter-spacing:.05em; margin-bottom:4px; font-weight:600;}
  .sub-toggle{display:flex; align-items:center; gap:5px; color:var(--bone-dim); font-size:11px; margin-top:9px;}
  .sub-toggle svg{width:13px; height:13px; transition:transform .15s;}
  .sub-toggle.open{color:var(--brass);}
  .sub-toggle.open svg{transform:rotate(180deg);}
  .backup-bar{display:flex; justify-content:center; gap:24px; margin-top:20px; padding-top:16px; border-top:1px solid var(--divider);}
  .backup-link{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--bone-dim);}
  .backup-link svg{width:14px; height:14px;}

  .filters{display:flex; gap:8px; margin-bottom:16px;}
  .filter-chip{padding:6px 16px; border-radius:999px; font-size:14px; border:1px solid var(--panel-border); color:var(--bone-dim);}
  .filter-chip.active{background:var(--brass); color:var(--bg); border-color:var(--brass);}
  .range-tabs-row{display:flex; gap:6px; margin-bottom:14px;}
  .range-tab{flex:1; padding:8px 0; border-radius:10px; font-size:13px; font-weight:600; border:1px solid var(--panel-border); color:var(--bone-dim); background:var(--panel);}
  .range-tab.active{background:var(--brass); color:var(--bg); border-color:var(--brass);}
  .area-dropdown{margin-bottom:14px;}
  .area-toggle{display:flex; align-items:center; justify-content:space-between; width:100%; padding:12px 14px;
    border-radius:12px; border:1px solid var(--panel-border); background:var(--panel); color:var(--bone); font-size:14px;}
  .area-toggle svg{color:var(--brass-dim); transition:transform .15s;}
  .area-toggle.open svg{transform:rotate(180deg);}
  .area-menu{margin-top:6px; border-radius:12px; border:1px solid var(--panel-border); background:var(--panel); overflow:hidden;}
  .area-option{display:flex; align-items:center; gap:10px; padding:11px 14px; font-size:14px; color:var(--bone);
    border-bottom:1px solid var(--panel-border);}
  .area-option:last-child{border-bottom:none;}
  .area-option input{width:17px; height:17px; accent-color:var(--brass);}

  .tx-item{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--divider);}
  .tx-loc{font-weight:600; font-size:14.5px;}
  .tx-date{color:var(--bone-dim); font-size:12px; margin-top:2px;}
  .tx-delta{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700;}

  .save-toast{position:fixed; bottom:calc(78px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--brass); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600;
    transition:all .25s ease; pointer-events:none; z-index:50;}
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.64);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom));animation:fadeIn .16s ease}.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:slideUp .2s ease}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.modal-title{font-family:'Oswald',sans-serif;font-size:21px;letter-spacing:.04em}.modal-close{width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--bone-dim);display:grid;place-items:center}.modal .budget-form{margin:0}.modal .budget-form-actions{margin-top:16px;padding-top:14px;border-top:1px solid var(--divider)}.notes-label{font-size:10.5px;color:var(--brass);font-weight:700;letter-spacing:.07em;margin:4px 0}.notes-box{min-height:88px;resize:vertical;line-height:1.45}.sub-notes{margin-top:9px;padding:10px 12px;background:var(--bg);border:1px solid var(--divider);border-radius:11px;font-size:12.5px;line-height:1.45;white-space:pre-wrap}.goal-spacer{height:9px}.ledger-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;margin:12px 0 2px;border:1px solid var(--panel-border);border-radius:13px;background:var(--panel);font-size:13px;font-weight:700}.ledger-count{font-size:11px;color:var(--brass)}.tx-description{font-size:13.5px;font-weight:700}.tx-context{font-size:11.5px;color:var(--bone-dim);margin-top:3px}.tx-date{font-size:11.5px;color:var(--bone-dim);margin-top:3px}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}@media(min-width:521px){.modal-backdrop{align-items:center}.modal{max-height:82vh}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tab-bar" id="tabBar">
  <button class="tab-btn" id="tabModules" onclick="navigate('modules')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="tab-label">Modules</span>
  </button>
  <button class="tab-btn" id="tabVault" onclick="navigate('home')">
    <div class="tab-vault-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <span class="tab-label">Vault</span>
  </button>
  <button class="tab-btn" id="tabLedger" onclick="navigate('ledger')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
    <span class="tab-label">Ledger</span>
  </button>
</div>
<div class="save-toast" id="saveToast">Saved</div>

<script>
function setVH(){ document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px'); }
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);
</script>
<script>
/* ---------- palette / helpers ---------- */
const ROW_COLORS = ['#3f7a5c','#3b5568','#736e30','#a3483f','#6b4a73','#8a7038'];
const STORAGE_KEY = 'vault-tracker-data';
const DEFAULT_SAFE = [
  {id:'cash', name:'Cash', amount:77},
  {id:'quarter', name:'Quarters', amount:24},
  {id:'dime', name:'Dimes', amount:0.3},
  {id:'nickel', name:'Nickels', amount:0.1},
  {id:'penny', name:'Pennies', amount:0.01},
];

const genId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const fmt = (n) => { const v = Number(n)||0; const sign = v<0?'-':''; return `${sign}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; };
const computeTotal = (list) => list.reduce((s,i)=> s + (Number(i.amount)||0), 0);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
let state = { page:'home', safeItems:[], bankAccounts:[], budgets:[], subscriptions:[], liabilities:[], jobs:[], transactions:[], editing:null, editingPeriod:null, filter:'all', ledgerRange:'1M', areaFilter:{safe:true, bank:true, liability:true, budget:true, subscription:true}, areaDropdownOpen:false, expandedBudgets:{}, expandedLogs:{}, expandedSubscriptions:{}, expandedWeeks:{}, collapsedJobs:{}, editingJob:{}, moneyOrder:['safe','bank'], balancesOrder:['liability','income'], reorderMode:false, pendingRestore:null, modal:null, ledgerCollapsed:false };

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) throw new Error('no data');
    const data = JSON.parse(raw);
    state.safeItems = data.safeItems || [];
    state.bankAccounts = data.bankAccounts || [];
    state.budgets = (data.budgets || []).map(b => ({...b, type: b.type || 'goal', contributions: b.contributions || {}, skippedPeriods: b.skippedPeriods || {}}));
    state.subscriptions = (data.subscriptions || []).map(s => {
      const due = s.dueDate ? new Date(s.dueDate + 'T00:00:00') : null;
      const billing = s.billing || s.renewalType || 'Monthly';
      const normalized = { ...s, notes: s.notes || '', billing, customBilling: s.customBilling || '' };
      if (normalized.renewalDay == null && due) normalized.renewalDay = due.getDate();
      if (normalized.renewalMonth == null && due && (billing === 'Annual')) normalized.renewalMonth = due.getMonth() + 1;
      if (normalized.renewalWeekday == null && due) normalized.renewalWeekday = due.getDay();
      if (normalized.weekInterval == null) normalized.weekInterval = billing === 'Biweekly' ? 2 : 1;
      return normalized;
    });
    state.liabilities = data.liabilities || [];
    state.jobs = (data.jobs || []).map(j => ({
      id: j.id, name: j.name, weeklyRate: j.weeklyRate || 0, payDays: j.payDays || [],
      workedDates: j.workedDates || [], paidWeeks: j.paidWeeks || {}
    }));
    state.transactions = data.transactions || [];
    const defaultMoneyOrder = ['safe','bank'];
    const savedMoneyOrder = Array.isArray(data.moneyOrder) ? data.moneyOrder.filter(k=>defaultMoneyOrder.includes(k)) : [];
    state.moneyOrder = [...savedMoneyOrder, ...defaultMoneyOrder.filter(k=>!savedMoneyOrder.includes(k))];
    const defaultBalancesOrder = ['liability','income'];
    const savedBalancesOrder = Array.isArray(data.balancesOrder) ? data.balancesOrder.filter(k=>defaultBalancesOrder.includes(k)) : [];
    state.balancesOrder = [...savedBalancesOrder, ...defaultBalancesOrder.filter(k=>!savedBalancesOrder.includes(k))];
  } catch(e){
    state.safeItems = DEFAULT_SAFE;
    state.bankAccounts = [];
    state.budgets = [];
    state.subscriptions = [];
    state.liabilities = [];
    state.jobs = [];
    state.transactions = [];
    save();
  }
}

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      safeItems: state.safeItems, bankAccounts: state.bankAccounts, budgets: state.budgets,
      subscriptions: state.subscriptions, liabilities: state.liabilities, jobs: state.jobs,
      transactions: state.transactions, moneyOrder: state.moneyOrder, balancesOrder: state.balancesOrder
    }));
    showSaved();
  } catch(e){
    console.error('Save failed', e);
    alert("Couldn't save your change. Your browser storage may be full or private-browsing is blocking it.");
  }
}

/* ---------- mutations ---------- */
function getList(scope){
  if (scope==='safe') return state.safeItems;
  if (scope==='bank') return state.bankAccounts;
  if (scope==='budget') return state.budgets;
  if (scope==='subscription') return state.subscriptions;
  if (scope==='liability') return state.liabilities;
}
function scopeLabel(scope){
  if (scope==='safe') return 'Safe';
  if (scope==='bank') return 'Bank';
  if (scope==='budget') return 'Budget';
  if (scope==='liability') return 'Liability';
  return 'Subscription';
}
function liabilitiesNet(){
  return state.liabilities.reduce((s,i)=> s + (i.type==='owed' ? (Number(i.amount)||0) : -(Number(i.amount)||0)), 0);
}
function computeNetWorth(){
  return computeTotal(state.safeItems) + computeTotal(state.bankAccounts) + liabilitiesNet();
}

function updateAmount(scope, id, newAmount){
  const list = getList(scope);
  const item = list.find(i=>i.id===id);
  if (!item) return;
  const delta = newAmount - item.amount;
  item.amount = newAmount;
  if (delta !== 0){
    state.transactions.push({
      id: genId(), date: new Date().toISOString(),
      location: `${scopeLabel(scope)}: ${item.name}`,
      description: `${delta>0?'Money added':'Money removed'}: ${item.name}`,
      scope, delta, total: computeNetWorth()
    });
  }
  state.editing = null;
  save(); render();
}

function addItem(scope, name, extra={}){
  const item = {id: genId(), name, amount:0, ...extra};
  getList(scope).push(item);
  save(); render();
}

function removeItem(scope, id){
  const list = getList(scope);
  const idx = list.findIndex(i=>i.id===id);
  if (idx===-1) return;
  const item = list[idx];
  list.splice(idx,1);
  if (item.amount !== 0){
    state.transactions.push({
      id: genId(), date: new Date().toISOString(),
      location: `${scopeLabel(scope)}: Removed ${item.name}`,
      description: `Money removed: ${item.name}`,
      scope, delta: -item.amount, total: computeNetWorth()
    });
  }
  save(); render();
}

/* ---------- budgets ---------- */
function monthDistance(fromDate, deadline){
  const start = new Date(fromDate + 'T00:00:00');
  const end = new Date(deadline + 'T00:00:00');
  return (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
}

function periodMonthDate(createdAt, n){
  const start = new Date(createdAt + 'T00:00:00');
  return new Date(start.getFullYear(), start.getMonth() + (n-1), 1);
}

function periodsUntil(fromDate, deadline, timeframe){
  const start = new Date(fromDate + 'T00:00:00');
  const end = new Date(deadline + 'T00:00:00');
  if (end < start) return 0;
  if (timeframe === 'weekly') return Math.max(1, Math.ceil((end-start)/86400000/7));
  return Math.max(1, monthDistance(fromDate, deadline));
}
function addBudget(name, type, target, deadline, timeframe, monthlyTarget){
  const createdAt = new Date().toISOString().slice(0,10);
  if (type === 'recurring'){
    state.budgets.push({id: genId(), name, type:'recurring', amount:0, monthlyTarget, timeframe:'monthly', createdAt, paidThrough:0, contributions:{}});
  } else {
    const totalPeriods = Math.max(1, periodsUntil(createdAt, deadline, timeframe));
    const installment = target / totalPeriods;
    state.budgets.push({id: genId(), name, type:'goal', amount:0, target, deadline, timeframe, createdAt, totalPeriods, installment, paidThrough:0, contributions:{}});
  }
  save(); render();
}

function budgetTotalPeriods(b){
  if (b.type === 'recurring'){
    const start = new Date(b.createdAt + 'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    const months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth()) + 1;
    const calendarBased = Math.max(1, months);
    return Math.max(calendarBased, (b.paidThrough||0) + 1);
  }
  return b.totalPeriods || 1;
}

function budgetInstallment(b){
  return b.type === 'recurring' ? b.monthlyTarget : b.installment;
}

function toggleBudgetExpand(id){
  state.expandedBudgets[id] = !state.expandedBudgets[id];
  render();
}

function periodLabel(b, n){
  if (b.timeframe === 'weekly'){
    const d = new Date(b.createdAt + 'T00:00:00');
    d.setDate(d.getDate() + (n-1)*7);
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  }
  const d = periodMonthDate(b.createdAt, n);
  return d.toLocaleDateString(undefined,{month:'short'});
}

function startMarkPeriod(budgetId, n){
  const b = state.budgets.find(x=>x.id===budgetId);
  if (!b) return;
  const periodsToCover = n - b.paidThrough;
  const rate = budgetInstallment(b) || 0;
  const suggested = +(rate * periodsToCover).toFixed(2);
  state.editingPeriod = {budgetId, n, value: String(suggested)};
  render();
}

function cancelMarkPeriod(){
  state.editingPeriod = null;
  render();
}

function commitMarkPeriod(){
  const ep = state.editingPeriod;
  if (!ep) return;
  const b = state.budgets.find(x=>x.id===ep.budgetId);
  if (!b) return;
  const amt = parseFloat(ep.value);
  if (isNaN(amt) || amt < 0){
    alert('Please enter a valid amount.');
    return;
  }
  if (!b.contributions) b.contributions = {};
  b.contributions[ep.n] = amt;
  b.amount += amt;
  b.paidThrough = ep.n;
  if (b.skippedPeriods) delete b.skippedPeriods[ep.n];
  state.editingPeriod = null;
  save(); render();
}

function skipMarkedPeriod(){
  const ep = state.editingPeriod;
  if (!ep) return;
  const b = state.budgets.find(x=>x.id===ep.budgetId);
  if (!b) return;
  if (!b.skippedPeriods) b.skippedPeriods = {};
  b.skippedPeriods[ep.n] = true;
  if (b.contributions) delete b.contributions[ep.n];
  b.paidThrough = Math.max(b.paidThrough || 0, ep.n);
  state.editingPeriod = null;
  save(); render();
}

function undoLastPeriod(budgetId){
  const b = state.budgets.find(x=>x.id===budgetId);
  if (!b || !b.paidThrough) return;
  const n = b.paidThrough;
  const amt = (b.contributions && b.contributions[n]) || 0;
  b.amount = Math.max(0, b.amount - amt);
  if (b.contributions) delete b.contributions[n];
  if (b.skippedPeriods) delete b.skippedPeriods[n];
  const contribKeys = b.contributions ? Object.keys(b.contributions).map(Number) : [];
  const skipKeys = b.skippedPeriods ? Object.keys(b.skippedPeriods).map(Number) : [];
  const allKeys = [...contribKeys, ...skipKeys];
  b.paidThrough = allKeys.length ? Math.max(...allKeys) : 0;
  save(); render();
}

  let cur = new Date(start + 'T00:00:00');

  while (cur <= last){

/* ---------- date/week helpers ---------- */
function getWeekStart(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0,10);
}

function formatShortDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

function formatRange(s, e){
  const sd = new Date(s + 'T00:00:00'), ed = new Date(e + 'T00:00:00');
  const sMonth = sd.toLocaleDateString(undefined,{month:'short'});
  const eMonth = ed.toLocaleDateString(undefined,{month:'short'});
  if (s === e) return `${sMonth} ${sd.getDate()}`;
  if (sMonth === eMonth) return `${sMonth} ${sd.getDate()}\u2013${ed.getDate()}`;
  return `${sMonth} ${sd.getDate()} \u2013 ${eMonth} ${ed.getDate()}`;
}

function compactDateRanges(dates){
  if (!dates.length) return '';
  const sorted = [...dates].sort();
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for (let i=1;i<sorted.length;i++){
    const d = sorted[i];
    const diffDays = Math.round((new Date(d+'T00:00:00') - new Date(prev+'T00:00:00')) / 86400000);
    if (diffDays === 1){ prev = d; continue; }
    ranges.push([start, prev]);
    start = d; prev = d;
  }
  ranges.push([start, prev]);
  return ranges.map(([s,e]) => formatRange(s,e)).join(', ');
}

function jobWeeks(job){
  const map = {};
  for (const d of job.workedDates){
    const wk = getWeekStart(d);
    (map[wk] = map[wk] || []).push(d);
  }
  return Object.keys(map).sort().reverse().map(weekStart => ({
    weekStart, dates: map[weekStart].sort(), paid: !!job.paidWeeks[weekStart]
  }));
}

function jobTotals(job){
  const weeks = jobWeeks(job);
  let earned = 0, paid = 0;
  for (const w of weeks){
    earned += job.weeklyRate;
    if (w.paid) paid += job.weeklyRate;
  }
  return {earned, paid, pending: earned - paid};
}

function overallIncomeTotals(){
  let earned = 0, paid = 0;
  for (const j of state.jobs){
    const t = jobTotals(j);
    earned += t.earned; paid += t.paid;
  }
  return {earned, paid, pending: earned - paid};
}

function incomeSummaryLabel(){
  if (state.jobs.length===0) return 'None yet';
  const {pending} = overallIncomeTotals();
  return pending > 0 ? fmt(pending)+' pending' : 'All paid up';
}

function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }

function nextPayDateLabel(payDays){
  if (!payDays || !payDays.length) return null;
  const sorted = [...payDays].sort((a,b)=>a-b);
  const today = new Date(); today.setHours(0,0,0,0);
  const y = today.getFullYear(), m = today.getMonth();
  let candidate = sorted.map(d => new Date(y, m, Math.min(d, daysInMonth(y,m)))).find(dt => dt >= today);
  if (!candidate){
    const y2 = m===11 ? y+1 : y, m2 = (m+1)%12;
    candidate = new Date(y2, m2, Math.min(sorted[0], daysInMonth(y2,m2)));
  }
  return candidate.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

function payScheduleLabel(payDays){
  if (!payDays || !payDays.length) return 'No pay dates set';
  const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  return 'Paid on the ' + payDays.map(ord).join(' & ') + ' of each month';
}

/* ---------- backup / restore ---------- */
function exportBackup(){
  const data = {
    safeItems: state.safeItems, bankAccounts: state.bankAccounts, budgets: state.budgets,
    subscriptions: state.subscriptions, liabilities: state.liabilities, jobs: state.jobs,
    transactions: state.transactions, moneyOrder: state.moneyOrder, balancesOrder: state.balancesOrder,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vault-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      state.pendingRestore = data;
      render();
    } catch(err){
      alert("That file couldn't be read — make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
}

function confirmRestore(){
  const data = state.pendingRestore;
  if (!data) return;
  state.safeItems = data.safeItems || [];
  state.bankAccounts = data.bankAccounts || [];
  state.budgets = (data.budgets || []).map(b => ({...b, type: b.type || 'goal', contributions: b.contributions || {}, skippedPeriods: b.skippedPeriods || {}}));
  state.subscriptions = (data.subscriptions || []).map(s => {
      const due = s.dueDate ? new Date(s.dueDate + 'T00:00:00') : null;
      const billing = s.billing || s.renewalType || 'Monthly';
      const normalized = { ...s, notes: s.notes || '', billing, customBilling: s.customBilling || '' };
      if (normalized.renewalDay == null && due) normalized.renewalDay = due.getDate();
      if (normalized.renewalMonth == null && due && (billing === 'Annual')) normalized.renewalMonth = due.getMonth() + 1;
      if (normalized.renewalWeekday == null && due) normalized.renewalWeekday = due.getDay();
      if (normalized.weekInterval == null) normalized.weekInterval = billing === 'Biweekly' ? 2 : 1;
      return normalized;
    });
  state.liabilities = data.liabilities || [];
  state.jobs = data.jobs || [];
  state.transactions = data.transactions || [];
  if (Array.isArray(data.moneyOrder)) state.moneyOrder = data.moneyOrder;
  if (Array.isArray(data.balancesOrder)) state.balancesOrder = data.balancesOrder;
  state.pendingRestore = null;
  save(); render();
}

function cancelRestore(){
  state.pendingRestore = null;
  render();
}

function submitEditJob(id){
  const name = document.getElementById(`jobName-${id}`).value.trim();
  const rate = parseFloat(document.getElementById(`jobRate-${id}`).value);
  const payDaysRaw = document.getElementById(`jobPayDays-${id}`).value;
  const payDays = payDaysRaw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>=1 && n<=31);
  if (!name || isNaN(rate) || rate<0){
    alert('Please enter a job name and a weekly pay amount.');
    return;
  }
  state.editingJob[id] = false;
  updateJob(id, {name, weeklyRate: rate, payDays});
}

function renderBudgetCard(b, idx){
  const color = ROW_COLORS[idx % ROW_COLORS.length];
  const isGoal = b.type !== 'recurring';
  const pct = isGoal && b.target>0 ? Math.min(100, Math.round((b.amount/b.target)*100)) : 0;
  const achieved = isGoal && b.target>0 && b.amount >= b.target;
  const isEditing = state.editing && state.editing.scope==='budget' && state.editing.id===b.id;
  const isOpen = !!state.expandedBudgets[b.id];
  const logsOpen = !!state.expandedLogs[b.id];
  const dateLabel = isGoal ? new Date(b.deadline+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric'}) : '';
  const periodWord = b.timeframe==='weekly' ? 'week' : 'month';
  const installment = budgetInstallment(b);

  const savedControl = isEditing ? `
      <input class="row-input" id="edit-input" inputmode="decimal" value="${state.editing.value}" onkeydown="if(event.key==='Enter'){commitEdit('budget','${b.id}')}" oninput="state.editing.value=this.value" />
      <button class="icon-btn" style="color:#3f7a5c" onclick="commitEdit('budget','${b.id}')">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="state.editing=null; render();">${iconSvg('x')}</button>
      <button class="icon-btn" style="color:#a3483f" onclick="removeItem('budget','${b.id}')">${iconSvg('trash')}</button>
    ` : `<button class="row-amount" onclick="startEdit('budget','${b.id}', ${b.amount})">${fmt(b.amount)}</button>`;

  const suggestLine = isGoal
    ? (achieved
        ? `<div class="budget-suggest achieved">Goal reached</div>`
        : `<div class="budget-suggest">Save <b>${fmt(installment)}</b> / ${periodWord} to hit your goal — this amount is fixed and won't change</div>`)
    : `<div class="budget-suggest">Put away <b>${fmt(installment)}</b> / ${periodWord}</div>`;

  const totalPeriods = budgetTotalPeriods(b);
  const contributionsObj = b.contributions || {};
  const skippedObj = b.skippedPeriods || {};
  const isEditingThisBudget = state.editingPeriod && state.editingPeriod.budgetId === b.id;

  const visibleBubbles = [];
  const firstPending = Math.max(1, (b.paidThrough||0) + 1);
  // Show every remaining period in chronological order. Month labels intentionally
  // omit years, so a goal spanning multiple years may contain the same month name
  // more than once, but never out of sequence or silently omitted.
  for (let n = firstPending; n <= totalPeriods; n++) visibleBubbles.push(n);
  const bubbleRow = visibleBubbles.length === 0
    ? `<div class="bubble-done-note">${isGoal ? `All ${periodWord}s checked off` : `You're all set for this ${periodWord}`}</div>`
    : `<div class="bubble-row">${visibleBubbles.map(n => `<button class="bubble${n===b.paidThrough+1?' next':''}" onclick="startMarkPeriod('${b.id}',${n})" title="Log what you put in for ${periodLabel(b,n)}">${periodLabel(b,n)}</button>`).join('')}</div>`;

  const periodEntryForm = isEditingThisBudget ? `
    <div class="budget-form" style="padding:0; border:none; margin-top:6px;">
      <div class="bubble-label" style="margin-bottom:6px;">How much did you put in for ${periodLabel(b, state.editingPeriod.n)}?</div>
      <input class="add-input" id="periodAmount" inputmode="decimal" value="${state.editingPeriod.value}" oninput="state.editingPeriod.value=this.value" onkeydown="if(event.key==='Enter'){commitMarkPeriod()}" />
      <div class="budget-form-actions">
        <button class="icon-btn" style="color:#3f7a5c" onclick="commitMarkPeriod()">${iconSvg('check')}</button>
        <button class="backup-link" style="margin:0 6px;" onclick="skipMarkedPeriod()" title="Missed this ${periodWord}? Skip it without logging an amount.">Skip</button>
        <button class="icon-btn" style="color:#a8a49a" onclick="cancelMarkPeriod()">${iconSvg('x')}</button>
      </div>
    </div>` : '';

  const details = isOpen ? `
    <div class="budget-details">${b.notes ? `<div class="notes-label">NOTES</div><div class="sub-notes">${escapeHtml(b.notes)}</div>` : ''}
      ${suggestLine}
      ${!isEditingThisBudget ? `<div class="bubble-label">Tap the ${periodWord} you put money in for — earlier ones clear automatically</div>` : ''}
      ${isEditingThisBudget ? periodEntryForm : bubbleRow}
    </div>` : '';

  const logEntries = [];
  for (let n = 1; n <= b.paidThrough; n++){
    if (contributionsObj[n] !== undefined) logEntries.push({n, text: fmt(contributionsObj[n]), skipped:false});
    else if (skippedObj[n]) logEntries.push({n, text: 'Skipped', skipped:true});
  }
  const logsSection = logsOpen ? `
    <div class="budget-details">
      <div class="bubble-label" style="margin-bottom:6px;">Log history</div>
      ${logEntries.length === 0
        ? `<p class="empty-note" style="padding:6px 0;">No entries logged yet.</p>`
        : logEntries.map(e => `<div class="budget-meta" style="margin-top:0;"><span>${periodLabel(b,e.n)}</span><span style="${e.skipped?'color:var(--bone-dim);':''}">${e.text}</span></div>`).join('')}
      ${b.paidThrough > 0 ? `<div style="margin-top:8px;"><button class="backup-link" onclick="undoLastPeriod('${b.id}')">Undo last entry</button></div>` : ''}
    </div>` : '';

  const progressBar = isGoal ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${achieved?'#3f7a5c':'var(--brass)'}"></div></div>` : '';
  const metaLine = isGoal
    ? `<div class="budget-meta"><span>${fmt(b.amount)} of ${fmt(b.target)} · ${pct}%</span><span>by ${dateLabel}</span></div>`
    : `<div class="budget-meta"><span>Total saved: ${fmt(b.amount)}</span><span>${fmt(installment)}/mo</span></div>`;

  return `<div class="budget-card" style="border-left:4px solid ${color}">
    <div class="budget-head">
      <div class="budget-head-left">
        <button class="expand-btn${isOpen?' open':''}" onclick="toggleBudgetExpand('${b.id}')" aria-label="Toggle details">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="row-label" style="background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer;" onclick="toggleBudgetLogs('${b.id}')" title="View log history">${escapeHtml(b.name)}</button>
      </div>
      <div class="row-actions">${savedControl}</div>
    </div>
    ${progressBar}
    ${metaLine}
    ${details}
    ${logsSection}
  </div>`;
}

function subscriptionBillingLabel(s){
  if (s.billing === 'Other' && String(s.customBilling||'').trim()) return s.customBilling.trim();
  if (s.billing === 'Biweekly') return 'Every 2 weeks';
  if (s.billing === 'Quarterly') return 'Every 3 months';
  if (s.billing === 'Semiannual') return 'Every 6 months';
  return s.billing || 'Monthly';
}

function ordinal(n){
  const v = Number(n)||0;
  const mod100 = v % 100;
  const suffix = mod100>=11 && mod100<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[v%10] || 'th');
  return v + suffix;
}

function subscriptionRenewalText(s){
  const b = s.billing || 'Monthly';
  if (b === 'Monthly') return s.renewalDay ? `Renews on the ${ordinal(s.renewalDay)} · Monthly` : 'Renews monthly';
  if (b === 'Weekly' || b === 'Biweekly') {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const day = s.renewalWeekday == null ? '' : ` · ${days[Number(s.renewalWeekday)]}`;
    return `Renews every ${b === 'Biweekly' ? '2 weeks' : 'week'}${day} · ${subscriptionBillingLabel(s)}`;
  }
  if (b === 'Quarterly' || b === 'Semiannual') return s.renewalDay ? `Renews on the ${ordinal(s.renewalDay)} · ${subscriptionBillingLabel(s)}` : `Renews ${subscriptionBillingLabel(s).toLowerCase()}`;
  if (b === 'Annual') {
    const m = Number(s.renewalMonth)||0, d = Number(s.renewalDay)||0;
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return (m && d) ? `Renews on ${months[m-1]} ${ordinal(d)} · Annual` : 'Renews annually';
  }
  return `Renews · ${subscriptionBillingLabel(s)}`;
}

function subscriptionMonthlyCost(s){
  const a = Number(s.amount)||0;
  const b = s.billing || 'Monthly';
  if (b === 'Weekly') return a*52/12;
  if (b === 'Biweekly') return a*26/12;
  if (b === 'Quarterly') return a/3;
  if (b === 'Semiannual') return a/6;
  if (b === 'Annual') return a/12;
  return a;
}

function getFilteredTransactions(){
  const cutoff = getRangeCutoffDate(state.ledgerRange);
  const inRange = t => !cutoff || new Date(t.date) >= cutoff;
  return state.transactions
    .filter(inRange)
    .filter(t => state.areaFilter[t.scope]);
}

function getRangeCutoffDate(range){
  const now = new Date();
  if (range === '1D') return new Date(now.getTime() - 24*3600*1000);
  if (range === '1W') return new Date(now.getTime() - 7*24*3600*1000);
  if (range === '1M'){ const d = new Date(now); d.setMonth(d.getMonth()-1); return d; }
  if (range === '1Y'){ const d = new Date(now); d.setFullYear(d.getFullYear()-1); return d; }
  return null;
}

}

function renderLedger(){const filteredAsc=getFilteredTransactions().sort((a,b)=>new Date(a.date)-new Date(b.date)),filtered=[...filteredAsc].reverse(),latest=filteredAsc.length?filteredAsc[filteredAsc.length-1]:null;const areas=['safe','bank','liability','budget','subscription'];const activeAreas=areas.filter(a=>state.areaFilter[a]);const allSelected=activeAreas.length===areas.length;const rangeTabs=[['1D','1D'],['1W','1W'],['1M','1M'],['1Y','1Y'],['All','all']].map(([label,key])=>`<button class="range-tab${state.ledgerRange===key?' active':''}" onclick="setLedgerRange('${key}')">${label}</button>`).join('');const areaLabel=allSelected?'All areas':(activeAreas.length?activeAreas.map(areaFullLabel).join(', '):'No areas selected');const areaMenu=state.areaDropdownOpen?`<div class="area-menu"><label class="area-option"><input type="checkbox" ${allSelected?'checked':''} onchange="toggleAllAreas()"> All</label>${areas.map(a=>`<label class="area-option"><input type="checkbox" ${state.areaFilter[a]?'checked':''} onchange="toggleArea('${a}')"> ${areaFullLabel(a)}</label>`).join('')}</div>`:'';const rows=filtered.map(t=>`<div class="tx-item"><div><div class="tx-description">${escapeHtml(txDescription(t))}</div><div class="tx-context">${escapeHtml(t.location||'')}</div><div class="tx-date">${new Date(t.date).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div></div><div class="tx-delta" style="color:${t.delta>=0?'#3f7a5c':'#a3483f'}">${t.delta>=0?'+':'-'}${fmt(Math.abs(t.delta)).slice(1)}</div></div>`).join('');const chart=filteredAsc.length<2?`<p class="empty-note">Not enough activity in this range to chart yet.</p>`:`<div style="height:200px"><canvas id="netChart"></canvas></div>`;return `${renderRootTopBar('Ledger',true)}<div class="content"><div class="chart-card"><div class="chart-scrub"><div class="chart-scrub-value" id="scrubValue">${latest?fmt(latest.total):fmt(computeNetWorth())}</div><div class="chart-scrub-delta" id="scrubDelta"></div><div class="chart-scrub-date" id="scrubDate">${latest?'Current':'No activity yet'}</div></div>${chart}</div><div class="range-tabs-row">${rangeTabs}</div><div class="area-dropdown"><button class="area-toggle${state.areaDropdownOpen?' open':''}" onclick="toggleAreaDropdown()"><span>${areaLabel}</span>${iconSvg('chevronDown')}</button>${areaMenu}</div><button class="ledger-toggle" onclick="state.ledgerCollapsed=!state.ledgerCollapsed;render()"><span>${state.ledgerCollapsed?'Show':'Hide'} ledger history</span><span class="ledger-count">${filtered.length} ${filtered.length===1?'entry':'entries'}</span></button>${state.ledgerCollapsed?'':`<div class="ledger-list">${rows||'<p class="empty-note">No transactions in this range.</p>'}</div>`}</div>`}
function drawChartIfNeeded(){
  const canvas = document.getElementById('netChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') { console.error('Chart.js failed to load'); return; }
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  scrubIndex = null;

  if (!crosshairRegistered){
    Chart.register({
      id: 'crosshair',
      afterDatasetsDraw(chart){
        if (scrubIndex === null) return;
        const meta = chart.getDatasetMeta(0);
        const point = meta.data[scrubIndex];
        if (!point) return;
        const {ctx, chartArea} = chart;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4,4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#c9a24b99';
        ctx.moveTo(point.x, chartArea.top);
        ctx.lineTo(point.x, chartArea.bottom);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(point.x, point.y, 5.5, 0, Math.PI*2);
        ctx.fillStyle = '#c9a24b';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#121316';
        ctx.stroke();
        ctx.restore();
      }
    });
    crosshairRegistered = true;
  }

  const filteredAsc = getFilteredTransactions().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const showTime = state.ledgerRange === '1D' || state.ledgerRange === '1W';
  const labels = filteredAsc.map(t => new Date(t.date).toLocaleDateString(undefined, showTime ? {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'} : {month:'short', day:'numeric'}));
  const dateLabels = filteredAsc.map(t => new Date(t.date).toLocaleString(undefined, {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}));
  const data = filteredAsc.map(t => Math.round(t.total*100)/100);

  chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor:'#c9a24b', backgroundColor:'#c9a24b22', tension:.3, pointBackgroundColor:'#c9a24b', pointBorderColor:'#121316', pointBorderWidth:1.5, pointRadius:4, pointHoverRadius:5, fill:true }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      animation:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{display:false}, tooltip:{ enabled:false } },
      scales:{
        x:{ display:false, grid:{ display:false } },
        y:{ ticks:{ color:'#a8a49a', font:{size:11}, callback:(v)=>'$'+v }, grid:{ color:'#2a2c32' } }
      }
    }
  });

  attachScrubEvents(chartInstance, filteredAsc, dateLabels);
}

function attachScrubEvents(chart, sortedData, dateLabels){
  const canvas = chart.canvas;
  const valueEl = document.getElementById('scrubValue');
  const deltaEl = document.getElementById('scrubDelta');
  const dateEl = document.getElementById('scrubDate');
  const latest = sortedData[sortedData.length - 1];

  function pickIndex(evt){
    const points = chart.getElementsAtEventForMode(evt, 'index', {intersect:false}, true);
    return points.length ? points[0].index : null;
  }

  function updateScrub(evt){
    const idx = pickIndex(evt);
    if (idx === null) return;
    scrubIndex = idx;
    chart.update('none');
    const point = sortedData[idx];
    const positive = point.delta >= 0;
    if (valueEl) valueEl.textContent = fmt(point.total);
    if (deltaEl){
      deltaEl.textContent = `${escapeHtml(point.location)} · ${positive?'+':'-'}${fmt(Math.abs(point.delta)).slice(1)}`;
      deltaEl.style.color = positive ? '#3f7a5c' : '#a3483f';
    }
    if (dateEl) dateEl.textContent = dateLabels[idx];
  }

  function endScrub(){
    scrubIndex = null;
    chart.update('none');
    if (valueEl) valueEl.textContent = latest ? fmt(latest.total) : fmt(computeNetWorth());
    if (deltaEl) deltaEl.textContent = '';
    if (dateEl) dateEl.textContent = 'Current';
  }

  canvas.onmousedown = (e) => { updateScrub(e); };
  canvas.onmousemove = (e) => { if (e.buttons === 1) updateScrub(e); };
  canvas.onmouseup = endScrub;
  canvas.onmouseleave = endScrub;

  canvas.ontouchstart = (e) => { updateScrub(e); e.preventDefault(); };
  canvas.ontouchmove = (e) => { updateScrub(e); e.preventDefault(); };
  canvas.ontouchend = endScrub;
  canvas.ontouchcancel = endScrub;
}

let moneySortable = null;
let balancesSortable = null;
function render(){
  const app = document.getElementById('app');
  if (state.page==='home') app.innerHTML = renderHome();
  else if (state.page==='modules') app.innerHTML = renderModules();
  else if (state.page==='settings') app.innerHTML = renderSettings();
  else if (state.page==='safe') app.innerHTML = renderSafe();
  else if (state.page==='bank') app.innerHTML = renderBank();
  else if (state.page==='liability') app.innerHTML = renderLiabilities();
  else if (state.page==='budget') app.innerHTML = renderBudget();
  else if (state.page==='subscription') app.innerHTML = renderSubscriptions();
  else if (state.page==='income') app.innerHTML = renderIncome();
  else if (state.page==='ledger') { app.innerHTML = renderLedger(); drawChartIfNeeded(); }
  app.insertAdjacentHTML('beforeend', modalHTML());

  const tabBar = document.getElementById('tabBar');
  const hiddenOnPages = ['settings'];
  if (tabBar) tabBar.style.display = hiddenOnPages.includes(state.page) ? 'none' : 'flex';

  const modulesPages = ['modules','budget','subscription','liability','income'];
  const homePages = ['home','safe','bank'];
  const activeTab = modulesPages.includes(state.page) ? 'tabModules' : homePages.includes(state.page) ? 'tabVault' : state.page==='ledger' ? 'tabLedger' : null;
  ['tabModules','tabVault','tabLedger'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', id === activeTab);
  });

  if (moneySortable){ moneySortable.destroy(); moneySortable = null; }
  if (balancesSortable){ balancesSortable.destroy(); balancesSortable = null; }
  if (state.reorderMode && typeof Sortable !== 'undefined'){
    const moneyList = document.getElementById('moneyList');
    if (moneyList){
      moneySortable = new Sortable(moneyList, {
        animation:150,
        onEnd: () => { state.moneyOrder = Array.from(moneyList.children).map(el=>el.dataset.key); save(); }
      });
    }
    const balancesList = document.getElementById('balancesList');
    if (balancesList){
      balancesSortable = new Sortable(balancesList, {
        animation:150,
        onEnd: () => { state.balancesOrder = Array.from(balancesList.children).map(el=>el.dataset.key); save(); }
      });
    }
  }
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
load();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
