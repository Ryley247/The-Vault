<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>The Vault</title>
<meta name="theme-color" content="#121316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Vault" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#121316; --panel:#1c1e23; --panel-border:#2c2f36; --divider:#2a2c32;
    --brass:#c9a24b; --brass-dim:#8a7038; --bone:#eae5d6; --bone-dim:#a8a49a;
    --ledger-green:#3f7a5c; --steel:#3b5568; --rust:#a3483f; --olive:#736e30; --plum:#6b4a73;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); height:100vh; height:calc(var(--vh, 1vh) * 100); overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;}
  body{font-family:'Inter',sans-serif; color:var(--bone); padding-bottom:env(safe-area-inset-bottom);}
  button{font-family:inherit; background:none; border:none; cursor:pointer; color:inherit; padding:0;}
  input{font-family:inherit;}
  #app{max-width:520px; margin:0 auto; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}

  .topbar{display:flex; align-items:center; gap:12px; padding:22px 20px 12px;}
  .back-btn{color:var(--brass); padding:6px; border-radius:999px; display:flex;}
  .page-title{font-family:'Oswald',sans-serif; font-size:22px; font-weight:500; letter-spacing:.04em; margin:0;}

  .dial-wrap{width:76px; height:76px; margin:0 auto 6px; position:relative;}
  .dial{width:100%; height:100%; border-radius:50%; border:3px solid var(--brass-dim);
    background:radial-gradient(circle at 35% 30%, #2a2d33, var(--bg) 70%);
    box-shadow:inset 0 0 20px rgba(0,0,0,.6), 0 0 0 6px var(--bg);
    position:relative; animation:spin 60s linear infinite;}
  @media (prefers-reduced-motion: reduce){ .dial{animation:none;} }
  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .tick{position:absolute; left:50%; top:50%; width:2px; height:42%; transform-origin:bottom; background:var(--panel-border);}
  .tick.major{background:var(--brass);}
  .dial-center{position:absolute; width:40%; height:40%; top:30%; left:30%; border-radius:50%;
    background:linear-gradient(145deg, var(--brass), var(--brass-dim));
    box-shadow:0 2px 6px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;}

  .home-title{text-align:center; margin-top:14px; font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; letter-spacing:.08em;}
  .home-sub{text-align:center; margin:3px 0 1px; color:var(--bone-dim); font-size:11.5px;}
  .net-worth{text-align:center; margin-bottom:16px; color:var(--brass); font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700;}

  .panel-btn{width:100%; display:flex; align-items:center; gap:10px; background:var(--panel);
    border:1px solid var(--panel-border); border-radius:14px; padding:11px 12px; margin-bottom:8px; text-align:left;}
  .panel-btn:active{transform:scale(.99);}
  .panel-btn.sortable-ghost{opacity:.35;}
  .panel-btn.sortable-chosen{background:#24262c;}
  .panel-icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .panel-icon svg{width:16px; height:16px;}
  .panel-body{flex:1; min-width:0;}
  .panel-title{font-family:'Oswald',sans-serif; font-size:14.5px; letter-spacing:.03em;}
  .panel-sub{color:var(--bone-dim); font-size:11px; margin-top:1px;}
  .panel-value{font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:600; flex-shrink:0;}
  .panel-grip{flex-shrink:0; opacity:.4;}
  .panel-grip svg{width:15px; height:15px;}
  .reorder-hint{text-align:center; font-size:11px; color:var(--bone-dim); margin-top:6px; opacity:.7;}

  .section-label{font-size:11.5px; letter-spacing:.06em; color:var(--brass); font-weight:600; margin-bottom:8px;}

  .content{padding:0 20px 40px;}
  .ledger-fab{position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom)); width:46px; height:46px;
    border-radius:50%; background:var(--panel); border:1px solid var(--panel-border); color:var(--brass);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:40;}
  .ledger-fab:active{transform:scale(.94);}

  .row{display:flex; align-items:center; justify-content:space-between; background:var(--panel);
    border-radius:16px; padding:16px 20px; margin-bottom:12px;}
  .row-label{font-weight:600; font-size:16px;}
  .row-amount{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;}
  .row-actions{display:flex; align-items:center; gap:10px;}
  .row-input{width:96px; text-align:right; background:var(--bg); color:var(--bone);
    border:1px solid var(--brass); border-radius:8px; padding:6px 8px; font-family:'JetBrains Mono',monospace;}
  .icon-btn{padding:2px; display:flex;}

  .add-row{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    border:1.5px dashed var(--brass-dim); color:var(--brass); border-radius:16px; padding:12px; margin-bottom:12px;}
  .add-form{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .add-input{flex:1; background:var(--panel); color:var(--bone); border:1px solid var(--panel-border);
    border-radius:12px; padding:12px;}

  .total-bar{display:flex; align-items:center; justify-content:space-between; border-radius:16px;
    padding:16px 20px; margin-top:16px; background:linear-gradient(120deg, var(--plum), #4a3350);}
  .total-label{font-family:'Oswald',sans-serif; letter-spacing:.05em; font-size:15px;}
  .total-value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700;}

  .chart-card{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:16px; margin-bottom:20px;}
  .empty-note{text-align:center; padding:24px 10px; color:var(--bone-dim); font-size:13.5px;}

  .budget-card{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .budget-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px;}
  .budget-head-left{display:flex; align-items:center; gap:8px; min-width:0;}
  .expand-btn{color:var(--bone-dim); flex-shrink:0; transition:transform .2s ease;}
  .expand-btn.open{transform:rotate(180deg); color:var(--brass);}
  .progress-track{height:7px; background:var(--panel-border); border-radius:999px; overflow:hidden; margin-bottom:6px;}
  .progress-fill{height:100%; border-radius:999px; transition:width .3s ease;}
  .budget-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--bone-dim); gap:8px;}
  .budget-details{margin-top:10px; padding-top:10px; border-top:1px solid var(--divider);}
  .budget-suggest{font-size:13.5px; color:var(--bone); margin-bottom:10px;}
  .budget-suggest.achieved{color:#3f7a5c; font-weight:600;}
  .budget-form{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px;}
  .budget-form-row{display:flex; gap:8px;}
  .budget-form-row .add-input{flex:1; min-width:0;}
  .budget-form-actions{display:flex; justify-content:flex-end; gap:14px; padding-top:2px;}
  input[type=date].add-input, select.add-input{color-scheme:dark;}

  .bubble-label{font-size:11.5px; color:var(--bone-dim); margin-bottom:6px;}
  .bubble-row{display:flex; flex-wrap:wrap; gap:8px;}
  .bubble{width:30px; height:30px; border-radius:50%; border:1.5px solid var(--brass-dim); color:var(--brass);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0;}
  .bubble:active{transform:scale(.92);}
  .bubble.next{background:var(--brass); color:var(--bg); border-color:var(--brass);}
  .bubble-done-note{font-size:12px; color:#3f7a5c; font-weight:600;}

  .sub-row{background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .sub-row-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .sub-due{font-size:12px; color:var(--bone-dim);}
  .backup-bar{display:flex; justify-content:center; gap:24px; margin-top:20px; padding-top:16px; border-top:1px solid var(--divider);}
  .backup-link{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--bone-dim);}
  .backup-link svg{width:14px; height:14px;}

  .filters{display:flex; gap:8px; margin-bottom:16px;}
  .filter-chip{padding:6px 16px; border-radius:999px; font-size:14px; border:1px solid var(--panel-border); color:var(--bone-dim);}
  .filter-chip.active{background:var(--brass); color:var(--bg); border-color:var(--brass);}

  .tx-item{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--divider);}
  .tx-loc{font-weight:600; font-size:14.5px;}
  .tx-date{color:var(--bone-dim); font-size:12px; margin-top:2px;}
  .tx-delta{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700;}

  .save-toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--brass); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600;
    transition:all .25s ease; pointer-events:none; z-index:50;}
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>
<button class="ledger-fab" id="ledgerFab" onclick="navigate('ledger')" aria-label="Open Ledger">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
</button>
<div class="save-toast" id="saveToast">Saved</div>

<script>
function setVH(){ document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px'); }
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);
</script>
<script>
/* ---------- palette / helpers ---------- */
const ROW_COLORS = ['#3f7a5c','#3b5568','#736e30','#a3483f','#6b4a73','#8a7038'];
const STORAGE_KEY = 'vault-tracker-data';
const DEFAULT_SAFE = [
  {id:'cash', name:'Cash', amount:77},
  {id:'quarter', name:'Quarters', amount:24},
  {id:'dime', name:'Dimes', amount:0.3},
  {id:'nickel', name:'Nickels', amount:0.1},
  {id:'penny', name:'Pennies', amount:0.01},
];

const genId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const fmt = (n) => { const v = Number(n)||0; const sign = v<0?'-':''; return `${sign}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; };
const computeTotal = (list) => list.reduce((s,i)=> s + (Number(i.amount)||0), 0);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
let state = { page:'home', safeItems:[], bankAccounts:[], budgets:[], subscriptions:[], liabilities:[], jobs:[], transactions:[], editing:null, filter:'all', expandedBudgets:{}, expandedWeeks:{}, expandedJobs:{}, homeOrder:['safe','bank','liability','budget','subscription','income'] };

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) throw new Error('no data');
    const data = JSON.parse(raw);
    state.safeItems = data.safeItems || [];
    state.bankAccounts = data.bankAccounts || [];
    state.budgets = data.budgets || [];
    state.subscriptions = data.subscriptions || [];
    state.liabilities = data.liabilities || [];
    state.jobs = (data.jobs || []).map(j => ({
      id: j.id, name: j.name, weeklyRate: j.weeklyRate || 0, payDays: j.payDays || [],
      workedDates: j.workedDates || [], paidWeeks: j.paidWeeks || {}
    }));
    state.transactions = data.transactions || [];
    const defaultOrder = ['safe','bank','liability','budget','subscription','income'];
    const savedOrder = Array.isArray(data.homeOrder) ? data.homeOrder.filter(k=>defaultOrder.includes(k)) : [];
    state.homeOrder = [...savedOrder, ...defaultOrder.filter(k=>!savedOrder.includes(k))];
  } catch(e){
    state.safeItems = DEFAULT_SAFE;
    state.bankAccounts = [];
    state.budgets = [];
    state.subscriptions = [];
    state.liabilities = [];
    state.jobs = [];
    state.transactions = [];
    save();
  }
}

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      safeItems: state.safeItems, bankAccounts: state.bankAccounts, budgets: state.budgets,
      subscriptions: state.subscriptions, liabilities: state.liabilities, jobs: state.jobs,
      transactions: state.transactions, homeOrder: state.homeOrder
    }));
    showSaved();
  } catch(e){
    console.error('Save failed', e);
    alert("Couldn't save your change. Your browser storage may be full or private-browsing is blocking it.");
  }
}

let toastTimer;
function showSaved(){
  const t = document.getElementById('saveToast');
  if (!t) return;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 900);
}

/* ---------- mutations ---------- */
function getList(scope){
  if (scope==='safe') return state.safeItems;
  if (scope==='bank') return state.bankAccounts;
  if (scope==='budget') return state.budgets;
  if (scope==='subscription') return state.subscriptions;
  if (scope==='liability') return state.liabilities;
}
function scopeLabel(scope){
  if (scope==='safe') return 'Safe';
  if (scope==='bank') return 'Bank';
  if (scope==='budget') return 'Budget';
  if (scope==='liability') return 'Liability';
  return 'Subscription';
}
function liabilitiesNet(){
  return state.liabilities.reduce((s,i)=> s + (i.type==='owed' ? (Number(i.amount)||0) : -(Number(i.amount)||0)), 0);
}
function computeNetWorth(){
  return computeTotal(state.safeItems) + computeTotal(state.bankAccounts) + liabilitiesNet();
}

function updateAmount(scope, id, newAmount){
  const list = getList(scope);
  const item = list.find(i=>i.id===id);
  if (!item) return;
  const delta = newAmount - item.amount;
  item.amount = newAmount;
  if (delta !== 0){
    state.transactions.push({
      id: genId(), date: new Date().toISOString(),
      location: `${scopeLabel(scope)}: ${item.name}`,
      scope, delta, total: computeNetWorth()
    });
  }
  state.editing = null;
  save(); render();
}

function addItem(scope, name, extra={}){
  const item = {id: genId(), name, amount:0, ...extra};
  getList(scope).push(item);
  save(); render();
}

function removeItem(scope, id){
  const list = getList(scope);
  const idx = list.findIndex(i=>i.id===id);
  if (idx===-1) return;
  const item = list[idx];
  list.splice(idx,1);
  if (item.amount !== 0){
    state.transactions.push({
      id: genId(), date: new Date().toISOString(),
      location: `${scopeLabel(scope)}: Removed ${item.name}`,
      scope, delta: -item.amount, total: computeNetWorth()
    });
  }
  save(); render();
}

/* ---------- budgets ---------- */
function periodsUntil(fromDate, deadline, timeframe){
  const start = new Date(fromDate); start.setHours(0,0,0,0);
  const end = new Date(deadline + 'T00:00:00');
  const days = Math.ceil((end - start) / 86400000);
  if (days <= 0) return 0;
  return timeframe === 'weekly' ? Math.max(1, Math.ceil(days/7)) : Math.max(1, Math.ceil(days/30.44));
}

function addBudget(name, target, deadline, timeframe){
  const createdAt = new Date().toISOString().slice(0,10);
  const totalPeriods = Math.max(1, periodsUntil(createdAt, deadline, timeframe));
  const installment = target / totalPeriods;
  state.budgets.push({id: genId(), name, amount:0, target, deadline, timeframe, createdAt, totalPeriods, installment, paidThrough:0});
  save(); render();
}

function toggleBudgetExpand(id){
  state.expandedBudgets[id] = !state.expandedBudgets[id];
  render();
}

function periodLabel(b, n){
  if (b.timeframe === 'weekly'){
    const d = new Date(b.createdAt + 'T00:00:00');
    d.setDate(d.getDate() + (n-1)*7);
    return d.toLocaleDateString(undefined,{month:'numeric', day:'numeric'});
  }
  const d = new Date(b.createdAt + 'T00:00:00');
  d.setMonth(d.getMonth() + (n-1));
  return d.toLocaleDateString(undefined,{month:'short'});
}

function markBudgetPeriod(id, n){
  const b = state.budgets.find(x=>x.id===id);
  if (!b) return;
  b.paidThrough = n;
  save(); render();
}

/* ---------- jobs / income ---------- */
function addJob(name, weeklyRate, payDays){
  state.jobs.push({id: genId(), name, weeklyRate, payDays, workedDates: [], paidWeeks: {}});
  save(); render();
}

function updateJob(id, patch){
  const j = state.jobs.find(x=>x.id===id);
  if (!j) return;
  Object.assign(j, patch);
  save(); render();
}

function removeJob(id){
  const idx = state.jobs.findIndex(x=>x.id===id);
  if (idx===-1) return;
  state.jobs.splice(idx,1);
  save(); render();
}

function toggleJobExpand(id){
  state.expandedJobs[id] = !state.expandedJobs[id];
  render();
}

function addWorkedDay(jobId, dateStr){
  const j = state.jobs.find(x=>x.id===jobId);
  if (!j || !dateStr) return;
  if (!j.workedDates.includes(dateStr)) j.workedDates.push(dateStr);
  j.workedDates.sort();
  save(); render();
}

function addWorkedDayRange(jobId, fromStr, toStr){
  const j = state.jobs.find(x=>x.id===jobId);
  if (!j || !fromStr) return;
  const to = toStr || fromStr;
  let start = fromStr, end = to;
  if (new Date(start) > new Date(end)) { [start, end] = [end, start]; }
  let cur = new Date(start + 'T00:00:00');
  const last = new Date(end + 'T00:00:00');
  while (cur <= last){
    const iso = cur.toISOString().slice(0,10);
    if (!j.workedDates.includes(iso)) j.workedDates.push(iso);
    cur.setDate(cur.getDate() + 1);
  }
  j.workedDates.sort();
  save(); render();
}

function removeWorkedDay(jobId, dateStr){
  const j = state.jobs.find(x=>x.id===jobId);
  if (!j) return;
  j.workedDates = j.workedDates.filter(d=>d!==dateStr);
  save(); render();
}

function toggleWeekPaid(jobId, weekStart){
  const j = state.jobs.find(x=>x.id===jobId);
  if (!j) return;
  j.paidWeeks[weekStart] = !j.paidWeeks[weekStart];
  save(); render();
}

function toggleWeekExpand(jobId, weekStart){
  const key = jobId + ':' + weekStart;
  state.expandedWeeks[key] = !state.expandedWeeks[key];
  render();
}

/* ---------- date/week helpers ---------- */
function getWeekStart(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0,10);
}

function formatShortDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

function formatRange(s, e){
  const sd = new Date(s + 'T00:00:00'), ed = new Date(e + 'T00:00:00');
  const sMonth = sd.toLocaleDateString(undefined,{month:'short'});
  const eMonth = ed.toLocaleDateString(undefined,{month:'short'});
  if (s === e) return `${sMonth} ${sd.getDate()}`;
  if (sMonth === eMonth) return `${sMonth} ${sd.getDate()}\u2013${ed.getDate()}`;
  return `${sMonth} ${sd.getDate()} \u2013 ${eMonth} ${ed.getDate()}`;
}

function compactDateRanges(dates){
  if (!dates.length) return '';
  const sorted = [...dates].sort();
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for (let i=1;i<sorted.length;i++){
    const d = sorted[i];
    const diffDays = Math.round((new Date(d+'T00:00:00') - new Date(prev+'T00:00:00')) / 86400000);
    if (diffDays === 1){ prev = d; continue; }
    ranges.push([start, prev]);
    start = d; prev = d;
  }
  ranges.push([start, prev]);
  return ranges.map(([s,e]) => formatRange(s,e)).join(', ');
}

function jobWeeks(job){
  const map = {};
  for (const d of job.workedDates){
    const wk = getWeekStart(d);
    (map[wk] = map[wk] || []).push(d);
  }
  return Object.keys(map).sort().reverse().map(weekStart => ({
    weekStart, dates: map[weekStart].sort(), paid: !!job.paidWeeks[weekStart]
  }));
}

function jobTotals(job){
  const weeks = jobWeeks(job);
  let earned = 0, paid = 0;
  for (const w of weeks){
    earned += job.weeklyRate;
    if (w.paid) paid += job.weeklyRate;
  }
  return {earned, paid, pending: earned - paid};
}

function overallIncomeTotals(){
  let earned = 0, paid = 0;
  for (const j of state.jobs){
    const t = jobTotals(j);
    earned += t.earned; paid += t.paid;
  }
  return {earned, paid, pending: earned - paid};
}

function incomeSummaryLabel(){
  if (state.jobs.length===0) return 'None yet';
  const {pending} = overallIncomeTotals();
  return pending > 0 ? fmt(pending)+' pending' : 'All paid up';
}

function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }

function nextPayDateLabel(payDays){
  if (!payDays || !payDays.length) return null;
  const sorted = [...payDays].sort((a,b)=>a-b);
  const today = new Date(); today.setHours(0,0,0,0);
  const y = today.getFullYear(), m = today.getMonth();
  let candidate = sorted.map(d => new Date(y, m, Math.min(d, daysInMonth(y,m)))).find(dt => dt >= today);
  if (!candidate){
    const y2 = m===11 ? y+1 : y, m2 = (m+1)%12;
    candidate = new Date(y2, m2, Math.min(sorted[0], daysInMonth(y2,m2)));
  }
  return candidate.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

function payScheduleLabel(payDays){
  if (!payDays || !payDays.length) return 'No pay dates set';
  const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  return 'Paid on the ' + payDays.map(ord).join(' & ') + ' of each month';
}

/* ---------- backup / restore ---------- */
function exportBackup(){
  const data = {
    safeItems: state.safeItems, bankAccounts: state.bankAccounts, budgets: state.budgets,
    subscriptions: state.subscriptions, liabilities: state.liabilities, jobs: state.jobs,
    transactions: state.transactions, exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vault-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('This will replace everything currently in the app with this backup. Continue?')) return;
      state.safeItems = data.safeItems || [];
      state.bankAccounts = data.bankAccounts || [];
      state.budgets = data.budgets || [];
      state.subscriptions = data.subscriptions || [];
      state.liabilities = data.liabilities || [];
      state.jobs = data.jobs || [];
      state.transactions = data.transactions || [];
      save(); render();
      alert('Backup restored.');
    } catch(err){
      alert("That file couldn't be read — make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
}

  const isEditing = state.editing && state.editing.scope==='budget' && state.editing.id===b.id;
  const isOpen = !!state.expandedBudgets[b.id];
  const dateLabel = new Date(b.deadline+'T00:00:00').toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
  const periodWord = b.timeframe==='weekly' ? 'week' : 'month';

  const savedControl = isEditing ? `
      <input class="row-input" id="edit-input" inputmode="decimal" value="${state.editing.value}" onkeydown="if(event.key==='Enter'){commitEdit('budget','${b.id}')}" oninput="state.editing.value=this.value" />

  const totalPeriods = b.totalPeriods || 1;
  const visibleBubbles = [];
  for (let n = b.paidThrough + 1; n <= totalPeriods; n++) visibleBubbles.push(n);
  const bubbleRow = visibleBubbles.length === 0
    ? `<div class="bubble-done-note">All ${periodWord}s checked off</div>`

  const details = isOpen ? `
    <div class="budget-details">
      ${suggestLine}
      <div class="bubble-label">Tap the ${periodWord} you've saved for — earlier ones clear automatically</div>
      ${bubbleRow}
    </div>` : '';

  return `<div class="budget-card" style="border-left:4px solid ${color}">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
      <button class="backup-link" onclick="toggleWeekExpand('${job.id}','${week.weekStart}')">${isOpen ? 'Hide days' : 'Edit days'}</button>
      <button class="add-row" style="padding:6px 14px; margin-bottom:0; width:auto; border-color:${week.paid?'#3f7a5c':'var(--brass-dim)'}; color:${week.paid?'#3f7a5c':'var(--brass)'}" onclick="toggleWeekPaid('${job.id}','${week.weekStart}')">${week.paid ? '✓ Paid' : 'Mark week paid'}</button>
    </div>
    ${dayChips}
  </div>`;
}

function renderJobCard(job, idx){
  const color = ROW_COLORS[idx % ROW_COLORS.length];
  const isOpen = !!state.expandedJobs[job.id];
  const weeks = jobWeeks(job);
  const totals = jobTotals(job);
  const nextPay = nextPayDateLabel(job.payDays);

  const editForm = isOpen ? `
    <div class="budget-details">
      <div class="budget-form" style="padding:0; border:none;">
        <input class="add-input" id="jobName-${job.id}" placeholder="Job / gig name" value="${escapeHtml(job.name)}" />
        <div class="budget-form-row">
          <input class="add-input" id="jobRate-${job.id}" placeholder="Pay per week" inputmode="decimal" value="${job.weeklyRate}" />
          <input class="add-input" id="jobPayDays-${job.id}" placeholder="Pay days e.g. 5, 20" value="${(job.payDays||[]).join(', ')}" />
        </div>
        <div class="budget-form-actions">
          <button class="icon-btn" style="color:#3f7a5c" onclick="submitEditJob('${job.id}')">${iconSvg('check')}</button>
          <button class="icon-btn" style="color:#a3483f" onclick="removeJob('${job.id}')">${iconSvg('trash')}</button>
          <button class="icon-btn" style="color:#a8a49a" onclick="toggleJobExpand('${job.id}')">${iconSvg('x')}</button>
        </div>
      </div>
    </div>` : '';

  return `<div class="budget-card" style="border-left:4px solid ${color}">
    <div class="budget-head">
      <div class="budget-head-left">
        <button class="expand-btn${isOpen?' open':''}" onclick="toggleJobExpand('${job.id}')" aria-label="Edit job">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <span class="row-label">${escapeHtml(job.name)}</span>
      </div>
      <span class="row-amount">${fmt(job.weeklyRate)}/wk</span>
    </div>
    <div class="budget-meta"><span>${payScheduleLabel(job.payDays)}</span>${nextPay ? `<span>Next: ${nextPay}</span>` : ''}</div>
    ${editForm}

    <div id="addRow-day-${job.id}" style="margin-top:12px;">
      <button class="add-row" onclick="showAddWorkedDayForm('${job.id}')">${iconSvg('plus')} Log a day worked</button>
    </div>

    ${weeks.length===0 ? `<p class="empty-note">No days logged yet for this job.</p>` : weeks.map((w,i)=>renderWeekRow(job,w,i)).join('')}

    <div class="budget-meta" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--divider);">
      <span>Should've earned: <b>${fmt(totals.earned)}</b></span>
      <span>Pending: <b style="color:${totals.pending>0?'var(--brass)':'#3f7a5c'}">${fmt(totals.pending)}</b></span>
    </div>
  </div>`;
}

function submitEditJob(id){
  const name = document.getElementById(`jobName-${id}`).value.trim();
  const rate = parseFloat(document.getElementById(`jobRate-${id}`).value);
  const payDaysRaw = document.getElementById(`jobPayDays-${id}`).value;
  const payDays = payDaysRaw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>=1 && n<=31);
  if (!name || isNaN(rate) || rate<0){
    alert('Please enter a job name and a weekly pay amount.');
    return;
  }
  state.expandedJobs[id] = false;
  updateJob(id, {name, weeklyRate: rate, payDays});
}

function showAddWeekDayForm(jobId, rowKey){
  const el = document.getElementById(`addRow-week-${rowKey}`);
  const todayStr = new Date().toISOString().slice(0,10);
  el.innerHTML = `<div class="budget-form">
    <div class="budget-form-row">
      <input class="add-input" id="weekDayFrom-${rowKey}" type="date" value="${todayStr}" autofocus />
      <input class="add-input" id="weekDayTo-${rowKey}" type="date" placeholder="To (optional)" />
    </div>
    <div class="budget-form-actions">
      <button class="icon-btn" style="color:#3f7a5c" onclick="submitAddWeekDay('${jobId}','${rowKey}')">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
    </div>
  </div>`;
}

function submitAddWeekDay(jobId, rowKey){
  const from = document.getElementById(`weekDayFrom-${rowKey}`).value;
  const to = document.getElementById(`weekDayTo-${rowKey}`).value;
  if (!from){ render(); return; }
  addWorkedDayRange(jobId, from, to);
}

function showAddWorkedDayForm(jobId){
  const el = document.getElementById(`addRow-day-${jobId}`);
  const todayStr = new Date().toISOString().slice(0,10);
  el.innerHTML = `<div class="budget-form">
    <div class="bubble-label" style="margin-bottom:0;">Add one day, or a range of consecutive days</div>
    <div class="budget-form-row">
      <input class="add-input" id="newDayFrom-${jobId}" type="date" value="${todayStr}" autofocus />
      <input class="add-input" id="newDayTo-${jobId}" type="date" placeholder="To (optional)" />
    </div>
    <div class="budget-form-actions">
      <button class="icon-btn" style="color:#3f7a5c" onclick="submitAddWorkedDay('${jobId}')">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
    </div>
  </div>`;
}

function submitAddWorkedDay(jobId){
  const from = document.getElementById(`newDayFrom-${jobId}`).value;
  const to = document.getElementById(`newDayTo-${jobId}`).value;
  if (!from){ render(); return; }
  addWorkedDayRange(jobId, from, to);
}

function renderIncome(){
  const empty = state.jobs.length===0 ? `<p class="empty-note">No jobs yet. Add one with its weekly pay and pay dates to start logging days worked.</p>` : '';
  const {earned, pending} = overallIncomeTotals();
  return `${renderTopBar('JOBS & GIGS')}
    <div class="content">
      ${empty}
      ${state.jobs.map((j,i)=>renderJobCard(j,i)).join('')}
      <div id="addRow-income">
        <button class="add-row" onclick="showAddJobForm()">${iconSvg('plus')} Add a job</button>
      </div>
      ${state.jobs.length>0 ? `
      <div class="total-bar" style="background:linear-gradient(120deg, #4f7a8c, #345363);"><span class="total-label">TOTAL SHOULD'VE EARNED</span><span class="total-value">${fmt(earned)}</span></div>
      ${pending>0 ? `<div class="total-bar" style="background:linear-gradient(120deg, #a3483f, #6e2f29);"><span class="total-label">PENDING PAYOUT</span><span class="total-value">${fmt(pending)}</span></div>` : ''}` : ''}
    </div>`;
}

function showAddJobForm(){
  const el = document.getElementById('addRow-income');
  el.innerHTML = `<div class="budget-form">
    <input class="add-input" id="newJobName" placeholder="Job / gig name" autofocus />
    <div class="budget-form-row">
      <input class="add-input" id="newJobRate" placeholder="Pay per week ($)" inputmode="decimal" />
      <input class="add-input" id="newJobPayDays" placeholder="Pay days e.g. 5, 20" />
    </div>
    <div class="budget-form-actions">
      <button class="icon-btn" style="color:#3f7a5c" onclick="submitAddJob()">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
    </div>
  </div>`;
  document.getElementById('newJobName').focus();
}

function submitAddJob(){
  const name = document.getElementById('newJobName').value.trim();
  const rate = parseFloat(document.getElementById('newJobRate').value);
  const payDaysRaw = document.getElementById('newJobPayDays').value;
  const payDays = payDaysRaw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>=1 && n<=31);
  if (!name || isNaN(rate) || rate<0){
    alert('Please enter a job name and a weekly pay amount.');
    return;
  }
  addJob(name, rate, payDays);
}

function showAddBudgetForm(){
  const el = document.getElementById('addRow-budget');
  const todayStr = new Date().toISOString().slice(0,10);
  el.innerHTML = `<div class="budget-form">
    <input class="add-input" id="budgetName" placeholder="What are you saving for?" />
    <input class="add-input" id="budgetTarget" placeholder="Target amount" inputmode="decimal" />
    <div class="budget-form-row">
      <input class="add-input" id="budgetDate" type="date" min="${todayStr}" />
      <select class="add-input" id="budgetTimeframe">
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
    </div>
    <div class="budget-form-actions">
      <button class="icon-btn" style="color:#3f7a5c" onclick="submitAddBudget()">${iconSvg('check')}</button>
      <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
    </div>
  </div>`;
  document.getElementById('budgetName').focus();
}

function submitAddBudget(){
  const name = document.getElementById('budgetName').value.trim();
  const target = parseFloat(document.getElementById('budgetTarget').value);
  const deadline = document.getElementById('budgetDate').value;
  const timeframe = document.getElementById('budgetTimeframe').value;
  if (!name || isNaN(target) || target<=0 || !deadline){
    alert('Please enter a name, a target amount above $0, and a target date.');
    return;
  }
  addBudget(name, target, deadline, timeframe);
}

function renderAddRow(scope, placeholder){
  return `<div id="addRow-${scope}">
    <button class="add-row" onclick="showAddForm('${scope}')">${iconSvg('plus')} ${placeholder}</button>
  </div>`;
}

function showAddForm(scope){
  const el = document.getElementById(`addRow-${scope}`);
  el.innerHTML = `<div class="add-form">
    <input class="add-input" id="addInput-${scope}" placeholder="Name" autofocus onkeydown="if(event.key==='Enter'){submitAdd('${scope}')}" />
    <button class="icon-btn" style="color:#3f7a5c" onclick="submitAdd('${scope}')">${iconSvg('check')}</button>
    <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
  </div>`;
  document.getElementById(`addInput-${scope}`).focus();
}

function submitAdd(scope){
  const input = document.getElementById(`addInput-${scope}`);
  const name = input.value.trim();
  if (name) addItem(scope, name); else render();
}

function renderAddLiabilityRow(type, label){
  const key = 'liability-' + type;
  return `<div id="addRow-${key}">
    <button class="add-row" onclick="showAddLiabilityForm('${type}')">${iconSvg('plus')} ${label}</button>
  </div>`;
}

function showAddLiabilityForm(type){
  const key = 'liability-' + type;
  const el = document.getElementById(`addRow-${key}`);
  el.innerHTML = `<div class="add-form">
    <input class="add-input" id="addInput-${key}" placeholder="Name" autofocus onkeydown="if(event.key==='Enter'){submitAddLiability('${type}')}" />
    <button class="icon-btn" style="color:#3f7a5c" onclick="submitAddLiability('${type}')">${iconSvg('check')}</button>
    <button class="icon-btn" style="color:#a8a49a" onclick="render()">${iconSvg('x')}</button>
  </div>`;
  document.getElementById(`addInput-${key}`).focus();
}

function submitAddLiability(type){
  const key = 'liability-' + type;
  const input = document.getElementById(`addInput-${key}`);
  const name = input.value.trim();
  if (name) addItem('liability', name, {type}); else render();
}

function startEdit(scope, id, amount){
  state.editing = {scope, id, value:String(amount)};
  render();
  const el = document.getElementById('edit-input');
  if (el){ el.focus(); el.select(); }
}

function commitEdit(scope, id){
  const el = document.getElementById('edit-input');
  const n = parseFloat(el ? el.value : state.editing.value);
  if (!isNaN(n)) updateAmount(scope, id, n);
  else { state.editing = null; render(); }
}

let chartInstance = null;
function renderLedger(){
  const sorted = [...state.transactions].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const filtered = [...state.transactions]
    .filter(t=> state.filter==='all' || t.scope===state.filter)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));

  const chartArea = sorted.length < 2
    ? `<p class="empty-note">Once you add or subtract money, your net worth over time shows up here.</p>`
    : `<div style="height:200px;"><canvas id="netChart"></canvas></div>`;

  const filters = ['all','safe','bank','liability','budget','subscription'].map(f => {
    const label = f==='all'?'All':f==='safe'?'Safe':f==='bank'?'Bank':f==='liability'?'Liability':f==='budget'?'Budget':'Subs';
    return `<button class="filter-chip${state.filter===f?' active':''}" onclick="state.filter='${f}'; render();">${label}</button>`;
  }).join('');

  const txList = filtered.length===0
    ? `<p class="empty-note">No transactions yet.</p>`
    : filtered.map(t => {
        const positive = t.delta >= 0;
        return `<div class="tx-item">
          <div>
            <div class="tx-loc">${escapeHtml(t.location)}</div>
            <div class="tx-date">${new Date(t.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
          </div>
          <div class="tx-delta" style="color:${positive?'#3f7a5c':'#a3483f'}">${positive?'+':'-'}${fmt(Math.abs(t.delta)).slice(1)}</div>
        </div>`;
      }).join('');

  return `${renderTopBar('THE LEDGER')}
    <div class="content">
      <div class="chart-card">${chartArea}</div>
      <div class="filters">${filters}</div>
      ${txList}
      <div class="backup-bar">
        <button class="backup-link" onclick="exportBackup()">${iconSvg('download')} Backup data</button>
        <button class="backup-link" onclick="document.getElementById('restoreFile').click()">${iconSvg('upload')} Restore</button>
        <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="importBackup(this.files[0])" />
      </div>
    </div>`;
}

function drawChartIfNeeded(){
  const canvas = document.getElementById('netChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') { console.error('Chart.js failed to load'); return; }
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const sorted = [...state.transactions].sort((a,b)=> new Date(a.date)-new Date(b.date));
  const labels = sorted.map(t => new Date(t.date).toLocaleDateString(undefined,{month:'short', day:'numeric'}));
  const data = sorted.map(t => Math.round(t.total*100)/100);
  chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor:'#c9a24b', backgroundColor:'#c9a24b22', tension:.3, pointBackgroundColor:'#c9a24b', pointRadius:3, fill:true }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> fmt(ctx.parsed.y) } } },
      scales:{
        x:{ ticks:{ color:'#a8a49a', font:{size:11} }, grid:{ color:'#2a2c32' } },
        y:{ ticks:{ color:'#a8a49a', font:{size:11}, callback:(v)=>'$'+v }, grid:{ color:'#2a2c32' } }
      }
    }
  });
}

let sortableInstance = null;
function render(){
  const app = document.getElementById('app');
  if (state.page==='home') app.innerHTML = renderHome();
  else if (state.page==='safe') app.innerHTML = renderSafe();
  else if (state.page==='bank') app.innerHTML = renderBank();
  else if (state.page==='liability') app.innerHTML = renderLiabilities();
  else if (state.page==='budget') app.innerHTML = renderBudget();
  else if (state.page==='subscription') app.innerHTML = renderSubscriptions();
  else if (state.page==='income') app.innerHTML = renderIncome();
  else if (state.page==='ledger') { app.innerHTML = renderLedger(); drawChartIfNeeded(); }
  const fab = document.getElementById('ledgerFab');
  if (fab) fab.style.display = state.page==='ledger' ? 'none' : 'flex';

  if (sortableInstance){ sortableInstance.destroy(); sortableInstance = null; }
  if (state.page==='home'){
    const list = document.getElementById('panelList');
    if (list && typeof Sortable !== 'undefined'){
      sortableInstance = new Sortable(list, {
        animation:150,
        delay:250, delayOnTouchOnly:true, touchStartThreshold:6,
        onEnd: () => {
          state.homeOrder = Array.from(list.children).map(el=>el.dataset.key);
          save();
        }
      });
    }
  }
}

/* ---------- init ---------- */
load();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
